 <div class="notes-title">📘 Unit 8(A) - परमाणु मॉडल (Atomic Models)</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: थॉमसन के परमाणु मॉडल लिखिए।
    </div>
    <div class="answer">
        जे. जे. थॉमसन ने 1904 में परमाणु का एक मॉडल प्रस्तुत किया, जिसे प्लम–पुडिंग मॉडल कहा जाता है।

        <div class="question-image">
            <img src="images/image4.png" alt="थॉमसन का प्लम-पुडिंग मॉडल">
        </div>

        <div class="question-image">
            <img src="images/image6.png" alt="थॉमसन के प्लम-पुडिंग मॉडल का त्रिविमीय दृश्य">
        </div>

        <strong>इसके मुख्य अभिगृहीत (अधिग्रहीत) निम्न हैं—</strong>

        <ol>
            <li>परमाणु एक धनात्मक आवेश का समान रूप से फैला गोला होता है।</li>
            <li>इस धनात्मक गोले के भीतर ऋणात्मक इलेक्ट्रॉन ऐसे धँसे रहते हैं जैसे पुडिंग में प्लम।</li>
            <li>परमाणु विद्युत रूप से उदासीन होता है क्योंकि धनात्मक और ऋणात्मक आवेश बराबर होते हैं।</li>
        </ol>

        <br>

        यह मॉडल परमाणु की स्थिरता और आवेश वितरण को समझाने का प्रयास करता है, परंतु बाद में रदरफोर्ड के प्रयोग से यह मॉडल असत्य सिद्ध हुआ।
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: थॉमसन के परमाणु मॉडल का एक महत्वपूर्ण निष्कर्ष लिखिए।
    </div>
    <div class="answer">
        परमाणु का द्रव्यमान तथा धनावेश सम्पूर्ण गोले में समान रूप से वितरित रहते हैं।
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: थॉमसन के परमाणु मॉडल के कोई दो दोष लिखिए।
    </div>
    <div class="answer">
        थॉमसन के परमाणु मॉडल के निम्न दोष हैं—

        <ol>
            <li>यह मॉडल परमाणुओं द्वारा α-कणों के प्रकीर्णन की व्याख्या नहीं कर सका।</li>
            <li>यह मॉडल हाइड्रोजन परमाणु के स्पेक्ट्रम की व्याख्या नहीं कर सका।</li>
        </ol>
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: परमाणु संरचना के संबंध में रदरफोर्ड द्वारा किये गये प्रयोग का नाम लिखिए।
    </div>
    <div class="answer">
        रदरफोर्ड द्वारा किए गए प्रयोग का नाम अल्फा-कण प्रकीर्णन (α-particle scattering) है।
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: रदरफोर्ड का अल्फा-कण प्रकीर्णन प्रयोग लिखिए।
    </div>
    <div class="answer">
        अर्नेस्ट रदरफोर्ड ने यह प्रयोग परमाणु की संरचना को समझने के लिए किया।

        <br><br>

        <strong>प्रयोग की विधि:</strong>

        <div class="question-image">
            <img src="images/image5.png" alt="अल्फा-कण प्रकीर्णन प्रयोग की व्यवस्था">
        </div>

        अल्फा-कणों की किरणें स्वर्ण-पन्नी पर डाली गईं। पन्नी से निकलने के बाद अल्फा-कणों के टकराने पर ZnS परदे पर चमक उत्पन्न हुई, जिसे विभिन्न कोणों पर देखा गया।

        <br><br>

        <strong>प्रेक्षण:</strong>

        <div class="question-image">
            <img src="images/image8.png" alt="अल्फा-कणों के प्रकीर्णन पथ का प्रेक्षण">
        </div>

        <ol>
            <li>अधिकांश अल्फा-कण सीधे निकल गए।</li>
            <li>कुछ अल्फा-कण थोड़े कोण से मुड़ गए।</li>
            <li>बहुत ही कम अल्फा-कण पीछे की ओर लौट गए।</li>
        </ol>

        <br>

        <strong>निष्कर्ष:</strong>

        <ol>
            <li>परमाणु का अधिकांश भाग रिक्त होता है।</li>
            <li>परमाणु के केंद्र में छोटा, घना, धनात्मक नाभिक होता है।</li>
            <li>नाभिक में परमाणु का लगभग सारा द्रव्यमान केंद्रित होता है।</li>
        </ol>

        <br>

        इसी प्रयोग के आधार पर रदरफोर्ड का परमाण्विक मॉडल प्रस्तुत किया गया।
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: परमाणु के नाभिकीय मॉडल की खोज किसने की?
    </div>
    <div class="answer">
        वैज्ञानिक रदरफोर्ड ने परमाणु के नाभिकीय मॉडल की खोज की।
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: रदरफोर्ड के परमाण्विक मॉडल के प्रमुख अभिगृहीत लिखिए।
        <br>अथवा
        <br>अल्फा कण प्रकीर्णन प्रयोग से प्राप्त निष्कर्ष लिखिए। (2024)
    </div>
    <div class="answer">
        रदरफोर्ड ने अल्फा-कण प्रकीर्णन प्रयोग के आधार पर परमाणु का परमाण्विक मॉडल प्रस्तुत किया।

        <div class="question-image">
            <img src="images/image2.png" alt="रदरफोर्ड का परमाण्विक मॉडल">
        </div>

        रदरफोर्ड के परमाण्विक मॉडल के अनुसार—

        <ol>
            <li>परमाणु के केंद्र में एक अत्यन्त छोटा, घना एवं धनात्मक नाभिक होता है।</li>
            <li>परमाणु का लगभग सम्पूर्ण द्रव्यमान नाभिक में केंद्रित होता है।</li>
            <li>नाभिक का आकार परमाणु की तुलना में बहुत छोटा होता है, इसलिए परमाणु का अधिकांश भाग रिक्त स्थान होता है।</li>
            <li>इलेक्ट्रॉन नाभिक के चारों ओर परिक्रमण करते हैं।</li>
            <li>परमाणु विद्युत रूप से तटस्थ होता है क्योंकि नाभिक का धनात्मक आवेश इलेक्ट्रॉनों के ऋणात्मक आवेश के बराबर होता है।</li>
        </ol>
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: रदरफोर्ड के प्रकीर्णन प्रयोग से नाभिक के आकार का अनुमान कैसे लगाया जाता है?
    </div>
    <div class="answer">
        रदरफोर्ड के प्रकीर्णन प्रयोग से, \(180^\circ\) पर प्रकीर्णित α-कण की प्रारंभिक गतिज ऊर्जा ज्ञात करके, परमाणु के नाभिक के आकार का अनुमान लगाया जा सकता है। इस स्थिति में α-कण की संपूर्ण गतिज ऊर्जा विद्युत स्थितिज ऊर्जा में परिवर्तित हो जाती है।

        <p style="margin-top:10px;"><em>(स्रोत नोट्स में इस बिंदु पर आगे की गणना/सूत्र नहीं दिया गया है — मूल दस्तावेज़ में यह उत्तर यहीं समाप्त हो जाता है।)</em></p>
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: रदरफोर्ड के परमाण्विक मॉडल के कोई दो दोष लिखिए।
    </div>
    <div class="answer">
        अर्नेस्ट रदरफोर्ड के परमाण्विक मॉडल के प्रमुख दोष—

        <ol>
            <li><strong>परमाणु की स्थिरता नहीं समझा सका</strong> - भौतिकी के अनुसार परिक्रमा करता इलेक्ट्रॉन ऊर्जा विकिरित करता है, जिससे उसे नाभिक में गिर जाना चाहिए, जबकि वास्तव में परमाणु स्थिर होता है।</li>
            <li><strong>रेखीय वर्णक्रम की व्याख्या नहीं कर सका</strong> - यह मॉडल हाइड्रोजन जैसे परमाणुओं के रेखीय वर्णक्रम की व्याख्या करने में असफल रहा।</li>
        </ol>
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: बोहर के परमाणु मॉडल के अभिगृहीत बताइए। (2019/23/26)
    </div>
    <div class="answer">
        <div class="question-image">
            <img src="images/image3.jpg" alt="बोहर का परमाणु मॉडल">
        </div>

        बोहर के मॉडल की अभिधारणाएं निम्नलिखित हैं—

        <ol>
            <li>इलेक्ट्रॉन नाभिक के चारों ओर किसी भी कक्षा में घूमने के बजाय, केवल कुछ विशिष्ट कक्षाओं में ही घूमता है। इन कक्षाओं को स्थिर कक्षाएँ कहते हैं क्योंकि इन कक्षाओं में घूमने वाले इलेक्ट्रॉन कोई ऊर्जा उत्सर्जित नहीं करते।</li>

            <li>इलेक्ट्रॉन केवल उन्हीं कक्षाओं में घूम सकता है जिनमें नाभिक के चारों ओर उसका कोणीय संवेग \(\dfrac{h}{2\pi}\) का पूर्णांक गुणज होता है। अर्थात
                <div class="formula">
                    $$
                    mvr=\frac{nh}{2\pi}
                    $$
                </div>
                जहाँ \(h\) प्लैंक स्थिरांक है।
            </li>

            <li>जब कोई इलेक्ट्रॉन उच्च ऊर्जा वाली ऊपरी कक्षा से निम्न ऊर्जा वाली निचली कक्षा में संक्रमण करता है, तो इन कक्षाओं में इलेक्ट्रॉन की ऊर्जा का अंतर विद्युत चुम्बकीय विकिरण के रूप में उत्सर्जित होता है। दूसरी ओर, यदि कोई इलेक्ट्रॉन निम्न ऊर्जा वाली निचली कक्षा से उच्च ऊर्जा वाली ऊपरी कक्षा में संक्रमण करता है, तो दोनों कक्षाओं के बीच ऊर्जा का अंतर विद्युत चुम्बकीय विकिरण के रूप में अवशोषित हो जाता है।</li>

            <li>जब कोई इलेक्ट्रॉन वृत्ताकार कक्षा में घूमता है, तो गतिशील संतुलन के लिए, इलेक्ट्रॉन और नाभिक के बीच कार्य करने वाला कुलंब बल वृत्ताकार पथ में गति के लिए आवश्यक अभिकेन्द्रीय बल प्रदान करता है।</li>
        </ol>
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: इलेक्ट्रॉन की कक्षा की बोहर की क्वांटम स्थिति क्या है?
    </div>
    <div class="answer">
        इस शर्त के अनुसार, इलेक्ट्रॉन केवल उन्हीं कक्षाओं में परिक्रमण कर सकता है जिनमें नाभिक के परितः उसका कोणीय संवेग \(\dfrac{h}{2\pi}\) का पूर्णांक गुणज हो। अर्थात

        <div class="formula">
            $$
            mvr=\frac{nh}{2\pi}
            $$
        </div>

        जहाँ \(h\) प्लैंक स्थिरांक है।
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: डी-ब्रॉग्ली तरंग अवधारणा द्वारा बोर कक्षीय क्वांटम स्थिति का सत्यापन कैसे किया जाता है? समझाइए।
    </div>
    <div class="answer">
        डी-ब्रॉग्ली के अनुसार, किसी परमाणु में इलेक्ट्रॉन की कक्षा की परिधि उसमें परिक्रमा कर रहे इलेक्ट्रॉन से संबद्ध पदार्थ तरंग की तरंगदैर्ध्य के पूर्णांक गुणज के बराबर होनी चाहिए।

        <br><br>

        यदि \(m\) द्रव्यमान का एक इलेक्ट्रॉन \(r\) त्रिज्या की कक्षा में \(v\) वेग से परिक्रमा कर रहा है, तो इलेक्ट्रॉन से संबद्ध पदार्थ तरंग की डी-ब्रॉग्ली तरंगदैर्ध्य \(\lambda=\dfrac{h}{mv}\) और कक्षा की परिधि \(=2\pi r_n\) है।

        <br><br>

        डी-ब्रॉग्ली के अनुसार,

        <div class="formula">
            $$
            2\pi r_n = n\lambda \quad \text{जहाँ } n=1,2,3,\ldots
            $$
        </div>

        <div class="formula">
            $$
            2\pi r_n = \frac{nh}{mv}
            $$
        </div>

        <div class="formula">
            $$
            mvr_n = \frac{nh}{2\pi}
            $$
        </div>

        यह बोहर की कक्षीय क्वांटम स्थिति है।
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: बोहर के परमाणु मॉडल में स्थायी कक्षा किसे कहते हैं?
    </div>
    <div class="answer">
        स्थायी कक्षा उन कक्षाओं को कहते हैं जिनमें किसी इलेक्ट्रॉन का कोणीय संवेग \(\dfrac{h}{mv}\) का पूर्ण गुणक होता है।

        <p style="margin-top:10px;"><em>(यह पंक्ति स्रोत दस्तावेज़ में जैसी थी वैसी ही रखी गई है; ध्यान दें कि यहाँ सूत्र \(\frac{h}{mv}\) है जबकि अन्य प्रश्नों में कोणीय संवेग की शर्त \(\frac{h}{2\pi}\) के पूर्णांक गुणज के रूप में दी गई है — यह विसंगति मूल स्रोत में ही मौजूद है, इसे सुधारा नहीं गया है।)</em></p>
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: यदि परमाणु में इलेक्ट्रॉन स्थिर हो तो क्या होगा?
    </div>
    <div class="answer">
        किसी कक्षा में इलेक्ट्रॉन का वृत्तीय मार्ग में चक्कर लगाना उस अभिकेन्द्र बल के कारण संभव होता है जो नाभिक के धनावेश और इलेक्ट्रॉनों के बीच लगने वाले स्थिर विद्युत् आकर्षण बल से संतुलित होता है। जब इलेक्ट्रॉन स्थिर हैं, तब अभिकेन्द्र बल के अभाव में इलेक्ट्रॉन स्थिर विद्युत् आकर्षण बल के कारण नाभिक में गिर जायेगा।
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: बोहर मॉडल में स्पेक्ट्रम की व्याख्या कीजिए।
    </div>
    <div class="answer">
        बोहर मॉडल के अनुसार—

        <ol>
            <li>परमाणु में इलेक्ट्रॉन केवल कुछ निश्चित कक्षाओं में ही घूम सकता है। इन कक्षाओं की ऊर्जा निश्चित होती है।</li>
            <li>जब इलेक्ट्रॉन उच्च ऊर्जा कक्षा से निम्न ऊर्जा कक्षा में आता है, तो ऊर्जा का अंतर फोटॉन के रूप में निकलता है।</li>
            <li>निकले हुए फोटॉन की आवृत्ति/तरंगदैर्ध्य निश्चित होती है, इसलिए रेखीय स्पेक्ट्रम प्राप्त होता है।</li>
            <li>जब इलेक्ट्रॉन अलग-अलग उच्च कक्षाओं से एक ही निश्चित कक्षा में आते हैं, तो जो स्पेक्ट्रम रेखाएँ मिलती हैं, वे मिलकर एक श्रेणी बनाती हैं।</li>
        </ol>
    </div>
</div>

<div class="qa-box">
    <div class="question">
        प्रश्न: हाइड्रोजन परमाणु की प्रमुख स्पेक्ट्रम श्रेणियाँ कौन-कौन सी हैं?
    </div>
    <div class="answer">
        <ol>
            <li><strong>लायमन श्रेणी</strong> - जब हाइड्रोजन परमाणु का इलेक्ट्रॉन किसी उच्च ऊर्जा कक्षा से \(n=1\) कक्षा में आता है, तो जो स्पेक्ट्रम रेखाएँ प्राप्त होती हैं, उन्हें लायमन श्रेणी कहते हैं। यह श्रेणी पराबैंगनी क्षेत्र में पाई जाती है।</li>
            <li><strong>बाल्मर श्रेणी</strong> - जब इलेक्ट्रॉन उच्च ऊर्जा कक्षाओं से \(n=2\) कक्षा में संक्रमण करता है, तब बनने वाली स्पेक्ट्रम रेखाएँ बाल्मर श्रेणी कहलाती हैं। यह श्रेणी दृश्य क्षेत्र में प्राप्त होती है।</li>
            <li><strong>पास्चेन श्रेणी</strong> - जब इलेक्ट्रॉन उच्च ऊर्जा स्तरों से \(n=3\) कक्षा में आता है, तो प्राप्त स्पेक्ट्रम को पास्चेन श्रेणी कहते हैं। यह अवरक्त क्षेत्र में होती है।</li>
            <li><strong>ब्रैकेट श्रेणी</strong> - जब इलेक्ट्रॉन किसी उच्च ऊर्जा कक्षा से \(n=4\) कक्षा में आता है, तब बनने वाली स्पेक्ट्रम रेखाएँ ब्रैकेट श्रेणी कहलाती हैं। यह भी अवरक्त क्षेत्र में पाई जाती है।</li>
            <li><strong>फुंड श्रेणी</strong> - जब इलेक्ट्रॉन उच्च ऊर्जा कक्षाओं से \(n=5\) कक्षा में संक्रमण करता है, तब प्राप्त स्पेक्ट्रम रेखाएँ फुंड श्रेणी कहलाती हैं। यह श्रेणी भी अवरक्त क्षेत्र में होती है।</li>
        </ol>

        <div class="question-image">
            <img src="images/image7.png" alt="हाइड्रोजन परमाणु की स्पेक्ट्रम श्रेणियाँ (लायमन, बाल्मर, पास्चेन, ब्रैकेट, फुंड)">
        </div>
    </div>
</div>

<!-- Content Protection Scripts -->
<script>
// Disable right-click context menu
document.addEventListener("contextmenu", function(e) {
    e.preventDefault();
    return false;
}, false);

// Disable text selection
document.addEventListener("selectstart", function(e) {
    e.preventDefault();
    return false;
}, false);

// Disable copy keyboard shortcut (Ctrl+C, Cmd+C)
document.addEventListener("keydown", function(e) {
    // Disable PrintScreen and related screenshot keys
    if (e.key === "PrintScreen" ||
        e.keyCode === 44 ||  // PrintScreen
        (e.ctrlKey && e.shiftKey && e.key === "S") ||  // Windows Snipping Tool
        (e.keyCode === 91 && e.shiftKey && e.key === "5")) {  // Mac Screenshot
        e.preventDefault();
        return false;
    }

    // Disable Ctrl+C and Cmd+C (copy)
    if ((e.ctrlKey || e.metaKey) && (e.key === "c" || e.keyCode === 67)) {
        e.preventDefault();
        alert("Copying content is not allowed on this page.");
        return false;
    }

    // Disable Ctrl+A (select all)
    if ((e.ctrlKey || e.metaKey) && (e.key === "a" || e.keyCode === 65)) {
        e.preventDefault();
        return false;
    }

    // Disable Ctrl+X (cut)
    if ((e.ctrlKey || e.metaKey) && (e.key === "x" || e.keyCode === 88)) {
        e.preventDefault();
        return false;
    }

    // Disable F12 (Developer Tools)
    if (e.keyCode === 123) {
        e.preventDefault();
        return false;
    }

    // Disable Ctrl+Shift+I (Developer Tools)
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "i" || e.keyCode === 73)) {
        e.preventDefault();
        return false;
    }

    // Disable Ctrl+Shift+J (Console)
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === "j" || e.keyCode === 74)) {
        e.preventDefault();
        return false;
    }
}, false);

// Prevent copy on mouse up
document.addEventListener("mouseup", function() {
    document.selection.empty ? document.selection.empty() : window.getSelection().removeAllRanges();
}, false);

// Disable paste
document.addEventListener("paste", function(e) {
    e.preventDefault();
    alert("Pasting content is not allowed on this page.");
    return false;
}, false);

// Add user-select: none CSS dynamically
document.addEventListener("DOMContentLoaded", function() {
    document.body.style.userSelect = "none";
    document.body.style.webkitUserSelect = "none";
    document.body.style.msUserSelect = "none";
    document.body.style.mozUserSelect = "none";
});

// Prevent image download
document.addEventListener("dragstart", function(e) {
    e.preventDefault();
    return false;
}, false);
</script>
