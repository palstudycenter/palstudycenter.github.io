
<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAL STUDY CENTER | Biology Chapter 7</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f7fb;
    line-height:1.7;
}

/* NAVBAR */

.navbar{
    background:rgba(15,23,42,0.90);
    backdrop-filter:blur(10px);
    box-shadow:0 4px 18px rgba(0,0,0,.18);
    padding:10px 0;
}

.navbar-brand{
    font-size:30px;
    font-weight:700;
    color:white !important;
}

.navbar-brand span{
    color:#93c5fd;
}

/* NOTES CONTAINER */

.notes-container{
    max-width:900px;
    margin:100px auto 50px;
    padding:20px;
}

/* CHAPTER TITLE */

.notes-title{
    background:#e3f2fd;
    color:#1565c0;
    padding:15px 20px;
    border-left:6px solid #1565c0;
    border-radius:50px;
    font-size:28px;
    font-weight:bold;
    margin-bottom:30px;
    text-align:center;
}

/* QUESTION ANSWER BOX */

.qa-box{
    background:white;
    padding:22px;
    margin-bottom:18px;
    border-radius:14px;
    border-left:6px solid #1565c0;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:.25s;
}

.qa-box:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.question{
    font-weight:bold;
    color:#1b3a57;
    margin-bottom:10px;
    font-size:19px;
}

.answer{
    color:#2c3e50;
    text-align:justify;
}

.answer ul,
.answer ol{
    margin-left:25px;
    margin-top:10px;
    margin-bottom:10px;
}

/* TABLE */

.answer table{
    width:100%;
    border-collapse:collapse;
    margin:12px 0;
    background:#fff;
    overflow-x:auto;
}

.answer table td,
.answer table th{
    border:1px solid #ddd;
    padding:10px 12px;
    text-align:left;
    vertical-align:top;
}

.answer table th{
    background:#eaf2fb;
    font-weight:bold;
    color:#1b3a57;
}

/* IMPORTANT POINT */

.important{
    background:#fff8e1;
    border-left:5px solid #ffb300;
    padding:12px 15px;
    margin-top:12px;
    border-radius:8px;
}

/* MOBILE */

@media(max-width:768px){

    .navbar-brand{
        font-size:24px;
    }

    .notes-container{
        margin-top:85px;
        padding:12px;
    }

    .notes-title{
        font-size:22px;
        border-radius:20px;
    }

    .qa-box{
        padding:17px;
    }

    .question{
        font-size:17px;
    }

}

/* PROTECTION */

</style>

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar fixed-top">

<div class="container">

<a class="navbar-brand" href="../index.html">
    पाल <span>स्टडी सेंटर</span>
</a>

</div>

</nav>


<!-- NOTES -->

<div class="notes-container">

<div class="notes-title">
    📘 अध्याय 7 — प्राणियों में संरचनात्मक संगठन
</div>




<!-- PROTECTION -->

<script>

document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("selectstart", e => e.preventDefault());

document.addEventListener("copy", e => {

    e.preventDefault();

    alert("Copying content is not allowed");

});

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
