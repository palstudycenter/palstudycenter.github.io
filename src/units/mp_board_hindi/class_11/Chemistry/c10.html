<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAL STUDY CENTER | Notes</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


<script>
window.MathJax={
 tex:{
 inlineMath:[
 ['$','$'],
 ['\\(','\\)']
 ]
}
};
</script>

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
background:#f5f7fb;
line-height:1.7;
}


/* NAVBAR */

    .navbar{

      background:rgba(15,23,42,0.45);

      backdrop-filter:blur(10px);

      box-shadow:0 4px 18px rgba(0,0,0,.18);

      padding:10px 0;

      transition:.3s;

    }

    .navbar-brand{

      font-size:28px;

      font-weight:700;

      color:white !important;

    }

.navbar-brand span{
    color:#93c5fd;
}
      .navbar-brand{
        font-size:40px;
      }
/* CONTENT */

.notes-container{

max-width:900px;

margin:100px auto 50px;

padding:20px;

}

.notes-title{

background:#e3f2fd;

color:#1565c0;

padding:10px;

border-left:5px solid #1565c0;

border-radius:50px;

font-size:30px;

font-weight:bold;
margin-top:100px;

margin-bottom:50px;

}



.qa-box{

background:white;

padding:22px;

margin-bottom:18px;

border-radius:14px;

border-left:6px solid #1565c0;

box-shadow:0 4px 12px rgba(0,0,0,.08);

transition:.25s;

}


.qa-box:hover{

transform:translateY(-4px);

box-shadow:0 10px 25px rgba(0,0,0,.15);

}



.question{

font-weight:bold;

color:#1b3a57;

margin-bottom:8px;

}
.question-image{
    text-align:center;
    margin:15px 0;
    overflow-x:auto;
}

.question-image img{
    max-width:100%;
    height:auto;
    display:block;
    margin:auto;
    border-radius:8px;
}



.answer{

color:#2c3e50;

text-align:justify;

}



@media(max-width:768px){

.notes-container{

margin-top:80px;

}


}
.formula{
    overflow-x:auto;
    overflow-y:hidden;
    margin:10px 0;
}

.answer table{
    width:100%;
    border-collapse:collapse;
    margin:12px 0;
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    display:block;
    overflow-x:auto;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
}

.answer table td, .answer table th{
    border:1px solid #ddd;
    padding:10px 12px;
    text-align:left;
    vertical-align:top;
    white-space:normal;
}

.answer table th{
    background:#eaf2fb;
    font-weight:bold;
    color:#1b3a57;
}

.answer ol, .answer ul{
    margin-left:20px;
    margin-top:10px;
    margin-bottom:10px;
}


</style>


</head>


<body>



<!-- NAVBAR -->


<nav class="navbar navbar-expand-lg fixed-top">


<div class="container">

<a class="navbar-brand" href="../index.html">

पाल <span>स्टडी सेंटर</span>

</a>
    <button class="navbar-toggler bg-light"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav">

      <span class="navbar-toggler-icon"></span>

    </button>

</div>

</nav>





<!-- NOTES -->

<div class="qa-box">
  <div class="container">
 <div class="notes-title">📘 Unit 2- </div>  
</div>
</div>






<!-- PROTECTION -->


<script>


document.addEventListener("contextmenu",
e=>e.preventDefault());


document.addEventListener("selectstart",
e=>e.preventDefault());


document.addEventListener("copy",
e=>{

e.preventDefault();

alert("Copying content is not allowed");

});


</script>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
