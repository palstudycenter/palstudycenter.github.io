
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>पाल स्टडी सेंटर गैलरी</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7ff;
  overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
  height:260px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:#fff;
  position:relative;
  background:linear-gradient(
    -45deg,
    #1f4db8,
    #6a11cb,
    #2575fc,
    #00c6ff
  );
  background-size:400% 400%;
  animation:gradientMove 8s ease infinite;
  overflow:hidden;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.header::before,
.header::after{
  content:"";
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,0.15);
  animation:float 6s infinite ease-in-out;
}

.header::before{
  width:120px;
  height:120px;
  top:20px;
  left:10%;
}

.header::after{
  width:180px;
  height:180px;
  bottom:10px;
  right:10%;
  animation-delay:2s;
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-25px);
  }
}

.header h1{
  font-size:40px;
  margin:0;
  text-shadow:0 0 15px rgba(255,255,255,0.7);
  position:relative;
  z-index:2;
}

.header p{
  margin-top:10px;
  font-size:18px;
  opacity:.95;
  position:relative;
  z-index:2;
}

/* ================= FILTER ================= */

.filters{
  text-align:center;
  margin:15px;
}

.filters button{
  margin:5px;
  padding:8px 15px;
  border-radius:6px;
  border:1px solid #1f4db8;
  background:#fff;
  color:#1f4db8;
  cursor:pointer;
}

.filters button:hover{
  background:#1f4db8;
  color:#fff;
}

/* ================= GALLERY ================= */

.gallery{
  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(200px,1fr)
  );
  gap:15px;
  padding:20px;
}

.card{
  border-radius:12px;
  overflow:hidden;
  background:#fff;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.08);
  transition:.3s;
}

.card:hover{
  transform:translateY(-6px);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  display:block;
  transition:.3s;
}

.card img:hover{
  transform:scale(1.05);
}

/* ================= MODAL ================= */

.modal{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.92);

  justify-content:center;
  align-items:center;
  flex-direction:column;

  padding:20px;
  overflow:hidden;
}

/*
  IMPORTANT:
  Image का original ratio खराब नहीं होगा।
  Portrait और landscape दोनों image सही दिखाई देंगी।
*/

.modal-img-box{
  width:100%;
  height:75vh;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;
}

.modal img{
  max-width:95%;
  max-height:100%;

  width:auto;
  height:auto;

  object-fit:contain;

  border-radius:10px;

  transform:scale(1);
  transition:transform .25s ease;

  user-select:none;
  -webkit-user-drag:none;
}

/* ================= BUTTONS ================= */

.btns{
  margin-top:15px;
  text-align:center;
  max-width:100%;
}

.btns button{
  margin:4px;
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#1f4db8;
  color:#fff;
  font-size:14px;
}

.btns button:hover{
  background:#2575fc;
}

/* CLOSE BUTTON */

.close-btn{
  background:#d62828 !important;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .header{
    height:220px;
  }

  .header h1{
    font-size:28px;
  }

  .header p{
    font-size:15px;
    padding:0 15px;
  }

  .gallery{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
  }

  .card img{
    height:150px;
  }

  .modal{
    padding:10px;
  }

  .modal-img-box{
    height:65vh;
  }

  .modal img{
    max-width:100%;
    max-height:100%;
  }

  .btns button{
    padding:8px 10px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

  <h1>📸 पाल स्टडी सेंटर</h1>

  <p>
    हमारी यादें • हमारी पहचान • हमारी गैलरी
  </p>

</div>


<!-- ================= FILTER ================= -->

<div class="filters">

  <button onclick="filterImages('All')">
    All
  </button>

  <button onclick="filterImages('Classroom')">
    Classroom
  </button>

  <button onclick="filterImages('Events')">
    Events
  </button>

  <button onclick="filterImages('Other')">
    Other
  </button>

</div>


<!-- ================= GALLERY ================= -->

<div
  class="gallery"
  id="gallery">
</div>


<!-- ================= MODAL ================= -->

<div
  class="modal"
  id="modal"
  onclick="backgroundClose(event)"
>

  <div class="modal-img-box">

    <img
      id="modalImg"
      alt="Pal Study Center Gallery"
    >

  </div>


  <div class="btns">

    <button onclick="prev(event)">
      ⬅ Prev
    </button>

    <button onclick="next(event)">
      Next ➡
    </button>

    <button onclick="zoomIn(event)">
      ➕ Zoom
    </button>

    <button onclick="zoomOut(event)">
      ➖ Zoom
    </button>

    <button onclick="resetZoom(event)">
      🔄 Reset
    </button>

    <button onclick="downloadImage(event)">
      ⬇ Download
    </button>

    <button onclick="startSlide(event)">
      ▶ Slideshow
    </button>

    <button onclick="stopSlide(event)">
      ⏸ Stop
    </button>

    <button
      class="close-btn"
      onclick="closeModal(event)"
    >
      Close ❌
    </button>

  </div>

</div>


<script>

/* =================================================
   IMAGE LIST
================================================= */

const images = [

  {
    src:"../assets/img/gallery/1.png",
    cat:"Classroom"
  },

  {
    src:"../assets/img/gallery/2.png",
    cat:"Classroom"
  },

  {
    src:"../assets/img/gallery/3.png",
    cat:"Classroom"
  },

  {
    src:"../assets/img/gallery/4.png",
    cat:"Classroom"
  },

  {
    src:"../assets/img/gallery/5.jpg",
    cat:"Classroom"
  },

  {
    src:"../assets/img/gallery/6.jpg",
    cat:"Classroom"
  },

  {
    src:"../assets/img/gallery/7.jpeg",
    cat:"Other"
  },

  {
    src:"../assets/img/gallery/8.png",
    cat:"Other"
  },

  {
    src:"../assets/img/gallery/9.jpeg",
    cat:"Other"
  },

  {
    src:"../assets/img/gallery/10.jpeg",
    cat:"Other"
  },

  {
    src:"../assets/img/gallery/11.jpeg",
    cat:"Other"
  },

  {
    src:"../assets/img/gallery/12.jpeg",
    cat:"Other"
  },

  {
    src:"../assets/img/gallery/13.jpeg",
    cat:"Other"
  },

  {
    src:"../assets/img/gallery/14.jpeg",
    cat:"Other"
  }

  /*
  आगे image जोड़नी हो तो:

  {
    src:"../assets/img/gallery/15.jpeg",
    cat:"Events"
  },

  {
    src:"../assets/img/gallery/16.jpeg",
    cat:"Other"
  }

  */

];


/* =================================================
   VARIABLES
================================================= */

let current = 0;

let scale = 1;

let slide = null;

let currentList = images;


/* =================================================
   LOAD GALLERY
================================================= */

function loadGallery(data = images){

  currentList = data;

  let html = "";

  data.forEach((img) => {

    /*
      IMPORTANT FIX:

      यहाँ filtered array का index नहीं,
      original images array का index लिया जा रहा है।
    */

    const originalIndex =
      images.indexOf(img);

    html += `

      <div
        class="card"
        onclick="openImg(${originalIndex})"
      >

        <img
          src="${img.src}"
          alt="Gallery Image"
          loading="lazy"
        >

      </div>

    `;

  });

  document.getElementById("gallery").innerHTML =
    html;
}


/* =================================================
   FILTER
================================================= */

function filterImages(cat){

  if(cat === "All"){

    loadGallery(images);

    return;

  }

  const filtered =
    images.filter(
      img => img.cat === cat
    );

  loadGallery(filtered);
}


/* =================================================
   OPEN IMAGE
================================================= */

function openImg(index){

  current = index;

  scale = 1;

  const modal =
    document.getElementById("modal");

  const modalImg =
    document.getElementById("modalImg");

  modal.style.display = "flex";

  modalImg.src =
    images[current].src;

  modalImg.style.transform =
    "scale(1)";

}


/* =================================================
   CLOSE
================================================= */

function closeModal(event){

  if(event){
    event.stopPropagation();
  }

  document.getElementById("modal")
    .style.display = "none";

  stopSlide();

}


/* =================================================
   BACKGROUND CLICK CLOSE
================================================= */

function backgroundClose(event){

  if(
    event.target.id === "modal"
  ){

    closeModal();

  }

}


/* =================================================
   NEXT
================================================= */

function next(event){

  if(event){
    event.stopPropagation();
  }

  current =
    (current + 1) %
    images.length;

  openImg(current);

}


/* =================================================
   PREVIOUS
================================================= */

function prev(event){

  if(event){
    event.stopPropagation();
  }

  current =
    (current - 1 + images.length) %
    images.length;

  openImg(current);

}


/* =================================================
   ZOOM IN
================================================= */

function zoomIn(event){

  if(event){
    event.stopPropagation();
  }

  scale += 0.2;

  document.getElementById("modalImg")
    .style.transform =
    `scale(${scale})`;

}


/* =================================================
   ZOOM OUT
================================================= */

function zoomOut(event){

  if(event){
    event.stopPropagation();
  }

  scale =
    Math.max(
      0.5,
      scale - 0.2
    );

  document.getElementById("modalImg")
    .style.transform =
    `scale(${scale})`;

}


/* =================================================
   RESET ZOOM
================================================= */

function resetZoom(event){

  if(event){
    event.stopPropagation();
  }

  scale = 1;

  document.getElementById("modalImg")
    .style.transform =
    "scale(1)";

}


/* =================================================
   DOWNLOAD
================================================= */

function downloadImage(event){

  if(event){
    event.stopPropagation();
  }

  const img =
    images[current];

  const a =
    document.createElement("a");

  a.href = img.src;

  a.download =
    "pal-study-center-" +
    (current + 1) +
    ".jpg";

  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);

}


/* =================================================
   SLIDESHOW
================================================= */

function startSlide(event){

  if(event){
    event.stopPropagation();
  }

  stopSlide();

  slide =
    setInterval(
      () => next(),
      3000
    );

}


/* =================================================
   STOP SLIDESHOW
================================================= */

function stopSlide(event){

  if(event){
    event.stopPropagation();
  }

  if(slide){

    clearInterval(slide);

    slide = null;

  }

}


/* =================================================
   KEYBOARD CONTROL
================================================= */

document.addEventListener(
  "keydown",
  function(e){

    const modal =
      document.getElementById("modal");

    if(
      modal.style.display !== "flex"
    ){

      return;

    }


    if(e.key === "ArrowRight"){

      next();

    }


    if(e.key === "ArrowLeft"){

      prev();

    }


    if(e.key === "Escape"){

      closeModal();

    }


    if(e.key === "+"){

      zoomIn();

    }


    if(e.key === "-"){

      zoomOut();

    }

  }
);


/* =================================================
   INITIAL LOAD
================================================= */

loadGallery();

</script>

</body>
</html>
