let currentBoard = "";
let currentClass = "";
let currentSubject = "";
function initBoards(){
  const box = document.getElementById("boardBox");
  box.innerHTML="";
  Object.keys(data).forEach(board=>{
    box.appendChild(createBtn(board,"#0D47A1",()=>{
      currentBoard = board;
      loadClasses();
      showPage("classPage");
    }));
  });
}
function loadClasses(){
  const box = document.getElementById("classBox");
  box.innerHTML = "";
  Object.keys(data[currentBoard]).forEach(cls=>{
    box.appendChild(createBtn(cls,"#0D47A1",()=>{
      currentClass = cls;
      loadSubjects();
      showPage("subjectPage");
    }));
  });
}
function loadSubjects(){
  const box = document.getElementById("subjectBox");
  box.innerHTML = "";
  const subjects = Object.keys(data[currentBoard][currentClass]);
  subjects.forEach(sub=>{
    box.appendChild(createBtn(sub,"#0D47A1",()=>{
      currentSubject = sub;
      loadUnits();
      showPage("unitPage");
    }));
  });
}
function loadUnits(){
  const box = document.getElementById("unitBox");
  box.innerHTML = "";
  const units = data[currentBoard]?.[currentClass]?.[currentSubject] || [];
  if(units.length === 0){
    box.innerHTML = "<p>No Units Available</p>";
    return;
  }
  units.forEach(u=>{
    box.appendChild(createBtn(u,"#0D47A1",()=>{
      alert("Access Restricted: यह स्टडी नोट्स केवल PAL Study Center के नामांकित विद्यार्थियों के लिए उपलब्ध हैं।");
    }));
  });
}
function createBtn(text,color,fn){
  const b = document.createElement("button");
  b.className = "main-btn";
  b.innerText = text;
  b.style.background = "linear-gradient(#0D47A1)";
  b.onclick = fn;
  return b;
}
function showPage(page){
  document.querySelectorAll("#boardPage,#classPage,#subjectPage,#unitPage").forEach(p=>p.style.display="none");
  document.getElementById(page).style.display="block";
}
function goBack(show,hide){
  document.getElementById(hide).style.display="none";
  document.getElementById(show).style.display="block";
}
showPage("boardPage");
initBoards();
</script>
