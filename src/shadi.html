<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let defaultGuests=[];
let guests=JSON.parse(localStorage.getItem('palGuests_BC_Original')||JSON.stringify(defaultGuests));
let nautaniyaGuests = JSON.parse(localStorage.getItem('nautaniyaGuests')||'[]');
let categories=[...new Set([...guests.map(g=>g.cat),...nautaniyaGuests.map(g=>g.cat)])]; if(!categories.length) categories=["मनासा","नीमच"];
let currentCat=categories[0]; let subSurnameFilter=null; let subSthanFilter=null; let subProgramFilter=null;
let foodMenus = JSON.parse(localStorage.getItem('foodMenus')||'{}');
let vendors=JSON.parse(localStorage.getItem('wedVendors')||'[]'); let members=JSON.parse(localStorage.getItem('wedMembers')||'[]'); let activities=JSON.parse(localStorage.getItem('wedActivity')||'[]'); let isFilteredView=false;
let tempSchedules = [];
function saveAll(){localStorage.setItem('palGuests_BC_Original',JSON.stringify(guests));localStorage.setItem('nautaniyaGuests',JSON.stringify(nautaniyaGuests));localStorage.setItem('wedVendors',JSON.stringify(vendors));localStorage.setItem('wedMembers',JSON.stringify(members));localStorage.setItem('wedActivity',JSON.stringify(activities));}

  function renderCats(){
 
    document.getElementById('catTabs').innerHTML=categories.map(c=>{
    let isNau = c.toLowerCase().includes('नौतानिया') || c.toLowerCase().includes('nautaniya');
   let cnt = isNau? nautaniyaGuests.filter(g=>g.cat==c).length : guests.filter(g=>g.cat==c).length;
   return `<button onclick="filterByCat('${c}')" class="btn btn-sm cat-btn ${isFilteredView && currentCat==c?'active':''}">${c} (${cnt})</button>`;
 }).join('');
}
function extractSurname(name){let clean=name.replace(/श्री/g,'').trim(); let parts=clean.split(' ').filter(p=>p); if(!parts.length) return ''; let last=parts[parts.length-1]; if(['जी'].includes(last) && parts.length>1) last=parts[parts.length-2]; return last;}
function getSubFilters(){
 let isNau = currentCat && (currentCat === "नौतानिया" || currentCat.toLowerCase()==="nautaniya");
 let list = isNau? nautaniyaGuests.filter(g=>g.cat==currentCat) : guests.filter(g=>g.cat==currentCat);
 let surnames=[...new Set(list.map(g=> (g.extra?.सरनेम || extractSurname(g.name)).trim()).filter(Boolean))];
 let sthans=[...new Set(list.map(g=> (g.extra?.स्थान || '').trim()).filter(Boolean))];
 let programs=[...new Set(list.flatMap(g=> g.events||[]).map(e=>e.trim()).filter(Boolean))];
 return {surnames, sthans, programs};
}
function renderSubFilters(){
 let box=document.getElementById('subFilterBox');
 if(!isFilteredView || currentCat===null){ box.style.display='none'; return; }
 let {surnames, sthans, programs}=getSubFilters();
 box.style.display='block';
 let html=`<div class="sub-title">1. फंक्शंस</div><div class="d-flex flex-wrap"><button onclick="setProgramFilter(null)" class="btn sub-btn ${subProgramFilter===null?'active':''}">सभी</button>`;
 programs.forEach(s=>{ html+=`<button onclick="setProgramFilter('${s}')" class="btn sub-btn ${subProgramFilter===s?'active':''}">${s}</button>`; });
 html+=`</div><hr class="divider-line"><div class="sub-title">2. परिवार</div><div class="d-flex flex-wrap"><button onclick="setSurnameFilter(null)" class="btn sub-btn ${subSurnameFilter===null?'active':''}">सभी</button>`;
 surnames.forEach(s=>{ html+=`<button onclick="setSurnameFilter('${s}')" class="btn sub-btn ${subSurnameFilter===s?'active':''}">${s}</button>`; });
 html+=`</div><hr class="divider-line"><div class="sub-title">3. निवास क्षेत्र</div><div class="d-flex flex-wrap"><button onclick="setSthanFilter(null)" class="btn sub-btn ${subSthanFilter===null?'active':''}">सभी</button>`;
 sthans.forEach(s=>{ html+=`<button onclick="setSthanFilter('${s}')" class="btn sub-btn ${subSthanFilter===s?'active':''}">${s}</button>`; });
 html+=`</div>`;
 box.innerHTML=html;
}
function setProgramFilter(p){subProgramFilter=p; renderSubFilters(); renderGuests();}
function setSurnameFilter(s){subSurnameFilter=s; renderSubFilters(); renderGuests();}
function setSthanFilter(s){subSthanFilter=s; renderSubFilters(); renderGuests();}


function clearTopActive(){
  document.getElementById('btnHome').classList.remove('active');
  document.getElementById('btnVendor').classList.remove('active');
  document.getElementById('btnFamily').classList.remove('active');
  let b=document.getElementById('btnDev'); if(b) b.classList.remove('active');
}
function filterByCat(cat){
  currentCat=cat; isFilteredView=true; subSurnameFilter=null; subSthanFilter=null; subProgramFilter=null;
  document.getElementById('foodBox').style.display='none';
  document.getElementById('excelBox').style.display='none';
  document.getElementById('foodMenuBox').style.display='none';
  document.getElementById('listBox').style.display='block';
  document.getElementById('listCat').innerText=cat;
  document.getElementById('tab-guest').classList.add('show','active');
  document.getElementById('tab-vendor').classList.remove('show','active');
  document.getElementById('tab-family').classList.remove('show','active');
  document.getElementById('tab-dev').classList.remove('show','active');
  renderCats(); renderSubFilters(); renderGuests();
}
function showAllView(){
  currentCat=null; isFilteredView=true;
  document.getElementById('foodBox').style.display='none';
  document.getElementById('excelBox').style.display='none';
  document.getElementById('foodMenuBox').style.display='none';
  document.getElementById('listBox').style.display='block';
  document.getElementById('subFilterBox').style.display='none';
  document.getElementById('tab-guest').classList.add('show','active');
  document.getElementById('tab-vendor').classList.remove('show','active');
  document.getElementById('tab-family').classList.remove('show','active');
  document.getElementById('tab-dev').classList.remove('show','active');
  renderCats(); renderGuestsAll();
}
function showFullView(){
  clearTopActive(); document.getElementById('btnHome').classList.add('active');
  isFilteredView=false; currentCat=categories[0];
  document.getElementById('foodBox').style.display='block';
  document.getElementById('excelBox').style.display='block';
  document.getElementById('foodMenuBox').style.display='none';
  document.getElementById('listBox').style.display='none';
  document.getElementById('subFilterBox').style.display='none';
  document.getElementById('tab-guest').classList.add('show','active');
  document.getElementById('tab-vendor').classList.remove('show','active');
  document.getElementById('tab-family').classList.remove('show','active');
  document.getElementById('tab-dev').classList.remove('show','active');
  renderCats(); renderFood();
}

  document.getElementById('listBox').style.display='none';
  document.getElementById('tab-guest').classList.remove('show','active');

  document.getElementById('tab-dev').classList.remove('show','active');
  document.getElementById('tab-vendor').classList.add('show','active');

function showFamilySection(){
  clearTopActive(); document.getElementById('btnFamily').classList.add('active');
  isFilteredView=false;
  document.getElementById('subFilterBox').style.display='none';
  document.getElementById('foodBox').style.display='none';
  document.getElementById('excelBox').style.display='none';

function applyAllFilters(list){
 let search=(document.getElementById('search').value||'').toLowerCase();
 return list.filter(g=>{
   if(search &&!g.name.toLowerCase().includes(search)) return false;
   if(subSurnameFilter && (g.extra?.सरनेम||'').trim()!==subSurnameFilter) return false;
   if(subSthanFilter && (g.extra?.स्थान||'').trim()!==subSthanFilter) return false;
   if(subProgramFilter &&!(g.events||[]).includes(subProgramFilter)) return false;
   return true;
 });
}

function formatRashiMulti(text){
 if(!text || text.toString().trim()==='' || text=='-') return '<div class="nek-line" style="color:#9ca3af">-</div>';
 return text.toString().split('+').map(p=>{
   let part = p.trim(); if(!part) return '';
   let amtMatch = part.match(/[\d,]+/);
   let descMatch = part.match(/\((.*?)\)/);
   let amt = amtMatch? amtMatch[0] : part;
   let desc = descMatch? descMatch[1] : '';
   let display = `₹${amt}`.replace('₹₹','₹');
   if(desc){ return `<div class="nek-line"><b>${display}</b> <span style="color:#6b7280">(${desc})</span></div>`; }
   else { return `<div class="nek-line"><b>${display}</b></div>`; }
 }).join('');
}

function importExcel(){
 let input=document.getElementById('excelFile'); let file=input.files[0]; if(!file){ alert('पहले Excel चुनें'); return; }
 document.getElementById('fileName').innerText='⏳ पढ़ रहा हूँ: '+file.name;
 let reader=new FileReader();
 reader.onload=function(e){
  try{
   let wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
   let newGuests=[]; let newCats=[]; let newNautania=[];
   // Menu Sheet पढ़ो - Fixed
 
   let menuSheetName = wb.SheetNames.find(n=> n.toLowerCase().trim() === 'menu');
   if(menuSheetName){
   
     let menuRows = XLSX.utils.sheet_to_json(wb.Sheets[menuSheetName]);
     console.log('Excel Menu Rows:', menuRows);
     foodMenus = {};
     menuRows.forEach(r=>{
       let keys = Object.keys(r);
       let pKey = keys.find(k=>k.toLowerCase().includes('prog'));
       let mKey = keys.find(k=>k.toLowerCase().includes('menu'));
       let dKey = keys.find(k=>k.toLowerCase().includes('day') || k.toLowerCase().includes('दिन'));
       let tKey = keys.find(k=>k.toLowerCase().includes('time') || k.toLowerCase().includes('समय'));
       let p = pKey? r[pKey].toString().trim() : '';
       if(!p) return;
       foodMenus[p] = {
         menu: mKey? r[mKey].toString().trim() : '',
         day: dKey? r[dKey].toString().trim() : '',
         time: tKey? r[tKey].toString().trim() : ''
       };
     });
     
     localStorage.setItem('foodMenus', JSON.stringify(foodMenus));
   }
    
   wb.SheetNames.forEach(sheet=>{
    if(sheet.toLowerCase().trim() === 'menu') return; // Menu को मेहमान में मत गिनो
    let cleanSheet=sheet.trim(); let rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1}); if(!rows.length) return;
    if(cleanSheet === "नौतानिया" || cleanSheet.toLowerCase() === "nautaniya"){
        if(!newCats.includes(cleanSheet)) newCats.push(cleanSheet);
        rows.forEach((r,i)=>{ if(i==0) return; if(!r[0]) return; let name=r[0]?r[0].toString():''; let surname=r[1]?r[1].toString().trim():''; let sthan=r[2]?r[2].toString().trim():''; let phone=r[3]?r[3].toString():''; let rashi=r[4]?r[4].toString().trim():''; let prog=r[5]?r[5].toString():''; let givenGift=r[6]?r[6].toString().trim():''; let receivedGift=r[7]?r[7].toString().trim():''; let extra={सरनेम:surname||extractSurname(name),स्थान:sthan}; newNautania.push({cat:cleanSheet,name:name,phone:phone,amount:rashi,events:prog?prog.split(',').map(s=>s.trim()).filter(s=>s):["शादी"],extra:extra,givenGift:givenGift,receivedGift:receivedGift,members:0}); }); return;
    }
         if(sheet.toLowerCase().trim() === 'menu') return;
    if(!newCats.includes(sheet)) newCats.push(sheet);
    rows.forEach((r,i)=>{ if(i==0) return; if(!r[0]) return; let name=r[0]?r[0].toString():''; let surname=r[1]?r[1].toString().trim():''; let sthan=r[2]?r[2].toString().trim():''; let phone=r[3]?r[3].toString():''; let members=parseInt(r[4])||1; let prog=r[5]?r[5].toString():''; let givenGift=r[6]?r[6].toString().trim():''; let receivedGift=r[7]?r[7].toString().trim():''; let extra={सरनेम:surname||extractSurname(name),स्थान:sthan}; newGuests.push({cat:sheet,name:name,phone:phone,members:members,events:prog?prog.split(',').map(s=>s.trim()).filter(s=>s):["शादी"],extra:extra,givenGift:givenGift,receivedGift:receivedGift}); });
   });
   guests=newGuests; nautaniyaGuests=newNautania; categories=newCats; currentCat=categories[0]||"मनासा"; saveAll(); renderCats(); renderFood();
   document.getElementById('fileName').innerText='✓ हो गया: '+file.name; alert('अपडेट हो गई - Menu भी सेव हो गया: ' + Object.keys(foodMenus).length + ' प्रोग्राम'); showFullView();
  }catch(err){ alert('Error: '+err.message); }
 };
 reader.readAsArrayBuffer(file);
}

function sendVendorReminder(v, scheduleIndex){
  if(!v.phone){ alert('फोन नहीं'); return; }
  let clean=v.phone.toString().replace(/[^0-9]/g,''); if(clean.length==10) clean='91'+clean;
  let s = v.schedules[scheduleIndex];
  if(!s) return;
  let workDate = new Date(s.date).toLocaleDateString('hi-IN',{day:'numeric',month:'long',year:'numeric'});
  let msg = `🙏 नमस्ते ${v.name} जी (${v.type})\n\nआपका कार्य याद दिलाना था:\n📅 तारीख: ${workDate}\n⏰ समय: ${s.time || 'समय तय नहीं'}\n🔧 काम: ${s.note}\n💰 कुल: ₹${v.price} | बाकी: ₹${v.price - v.adv}\n\nकृपया समय पर पहुंचें।\n- पाल परिवार, मनासा`;
  window.open(`https://wa.me/${clean}?text=${encodeURIComponent(msg)}`,'_blank');
}
function renderVendors(){
  let total=0,adv=0;
  document.getElementById('vendorList').innerHTML=vendors.map((v,i)=>{
    total+=v.price; adv+=v.adv;
