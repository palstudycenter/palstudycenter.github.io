function getData(dt){let d=String(dt.getDate()).padStart(2,"0"),m=String(dt.getMonth()+1).padStart(2,"0"),y=dt.getFullYear(),iso=`${d}-${m}-${y}`;return{iso,tithi:REAL_TITHI[iso]||"तिथि",fest:HINDU_FESTIVALS[iso]?.festival||""};}
const calMonth=document.getElementById("calMonth"),calBody=document.getElementById("calBody"),popup=document.getElementById("popup");
(function(){let s=new Date(2026,9,1),e=new Date(2027,10,31),c=new Date(s);while(c<=e){let o=document.createElement("option");o.value=c.getFullYear()+"-"+c.getMonth();o.textContent=c.toLocaleString("hi-IN",{month:"long",year:"numeric"});calMonth.appendChild(o);c.setMonth(c.getMonth()+1);}calMonth.value=new Date().getFullYear()+"-"+new Date().getMonth();})();
function render(){let [y,mo]=calMonth.value.split("-").map(Number),first=new Date(y,mo,1),start=first.getDay(),last=new Date(y,mo+1,0);calBody.innerHTML="";for(let i=0;i<start;i++){let d=document.createElement("div");d.style.visibility="hidden";calBody.appendChild(d);}for(let d=1;d<=last.getDate();d++){let dt=new Date(y,mo,d),hd=getData(dt);let div=document.createElement("div");div.className="cal-day"+(hd.fest?" holiday":"");div.innerHTML=`<div style="font-weight:900">${d}</div><div class="tithi">${hd.tithi}</div>${hd.fest?`<div class="fest">${hd.fest}</div>`:""}`;div.onclick=()=>{popup.style.display="block";popup.innerHTML=`<b>${dt.toLocaleDateString("hi-IN",{day:"numeric",month:"long",year:"numeric"})}</b><hr><div>तिथि: ${hd.tithi}</div>${hd.fest?`<div style="margin-top:8px;background:#fffbeb;padding:8px;border-radius:8px">पर्व: ${hd.fest}</div>`:""}<button onclick="popup.style.display='none'" class="btn btn-sm mt-2" style="background:#174a7e;color:#fff">बंद</button>`;};calBody.appendChild(div);}}render();
