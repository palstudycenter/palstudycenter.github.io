<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पाल स्टडी सेंटर - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
body{background:#fdf6ee;font-family:Poppins,sans-serif}

.header{background:linear-gradient(135deg,#174a7e 0%,#1e6fa5 100%);color:#fff;padding:20px 10px 18px;border-radius:0 0 18px 18px;position:sticky;top:0;z-index:103}
    .filter-fixed{background:#fff;border-radius:0 0 15px 15px;box-shadow:0 6px 18px rgba(0,0,0,.08);padding:10px;position:sticky;top:78px;z-index:102;margin:0 auto;max-width:520px;border:1px solid #e6eef7;border-top:none}
.card{border-radius:15px;border:none;box-shadow:0 6px 18px rgba(0,0,0,.06)}

.action-btn{background:rgba(255,255,255,0.15)!important;color:#fff!important;border:1.5px solid rgba(255,255,255,.4)!important;border-radius:26px!important;font-weight:700!important;padding:10px 18px!important;font-size:12.5px;white-space:nowrap;flex:0 0 auto!important;min-width:95px;height:46px}    
    .action-btn.active{background:#fff!important;color:#174a7e!important}
.filter-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.filter-btn{background:linear-gradient(135deg,#174a7e 0%,#1e6fa5 100%)!important;color:#fff!important;border:none!important;border-radius:10px!important;font-weight:700!important;min-height:44px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;font-size:11px}
.filter-btn.active{background:#fff!important;color:#174a7e!important;border:2px solid #174a7e!important}
.student-card{background:#fff;border:1px solid #e6eef7;border-radius:12px;padding:10px;width:100%;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}

/* === FIX OVERLAP - ALL TABS SAME PATTERN === */
#tab-students, #tab-tests, #tab-notice{
  position:sticky;
  top:248px;
  z-index:101;
  max-width:520px;
  margin:0 auto;
}
#tab-students.card, #tab-tests.card, #tab-notice.card{
  background:#fff;
  border-radius:0 0 15px 15px;
  border:1px solid #e6eef7;
  border-top:none;
  box-shadow:0 10px 20px rgba(0,0,0,.06);
  margin-top:0!important;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  max-height:calc(100vh - 260px);
}
#studentList{overflow-y:auto;flex:1;max-height:45vh;padding:2px}
#noticeModalContent{overflow-y:auto;flex:1;max-height:35vh}
.test-table-wrap{overflow:auto;flex:1;max-height:45vh;border-radius:0 0 12px 12px;border:none;border-top:1px solid #dbeafe;background:#fff}
#testTable thead th{position:sticky;top:0;background:#174a7e!important;color:#fff;font-size:10px;z-index:1}

.profile-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:center;z-index:9999;padding:12px}
.profile-modal-new{width:100%;max-width:520px;max-height:90vh;background:#fff;border-radius:20px;display:flex;overflow:hidden;position:relative}
.profile-left{width:38%;background:#f8fafc;border-right:1px solid #eef2f7;padding:16px;text-align:center;overflow-y:auto}
.profile-right{width:62%;padding:16px;overflow-y:auto}
.close-btn-new{position:absolute;top:8px;right:10px;border:none;background:#f1f5f9;border-radius:50%;width:30px;height:30px}
.hidden{display:none!important}
.container-fix{max-width:520px;margin:auto;padding:12px}
  </style>

</head>
<body>


<div class="header text-center" style="padding:20px 10px 18px; border-radius:0 !important; border:2px solid #0e3a66; border-top:none; border-left:none; border-right:none; border-bottom:3px solid #FDE68A;">
<div style="font-weight:900;color:#FDE68A;font-size:14px">॥ श्री गणेशाय नमः ॥</div>
<div class="d-flex mt-3" style="max-width:520px;margin:auto; gap:8px; overflow-x:auto; flex-wrap:nowrap; padding-bottom:6px; scrollbar-width:none; -webkit-overflow-scrolling:touch;">
<button id="bH" onclick="showTab('home')" class="action-btn active" style="min-width:95px; height:46px; font-size:12.5px; padding:10px 18px; border-radius:26px; flex:0 0 auto;">🏠 होम</button>
<button id="bK" onclick="showTab('students')" class="action-btn" style="min-width:95px; height:46px; font-size:12.5px; padding:10px 18px; border-radius:26px; flex:0 0 auto;">👨‍🎓 स्टूडेंट</button>
<button id="bT" onclick="showTab('tests')" class="action-btn" style="min-width:95px; height:46px; font-size:12.5px; padding:10px 18px; border-radius:26px; flex:0 0 auto;">📝 टेस्ट</button>
<button id="bN" onclick="showTab('notice')" class="action-btn" style="min-width:95px; height:46px; font-size:12.5px; padding:10px 18px; border-radius:26px; flex:0 0 auto;">📢 नोटिस</button>
<button id="bR" onclick="openReviewsPopup(event)" class="action-btn" style="min-width:95px; height:46px; font-size:12.5px; padding:10px 18px; border-radius:26px; flex:0 0 auto;">⭐ रिव्यू</button>
<button id="bP" onclick="location.href='psc.html'" class="action-btn" style="min-width:95px; height:46px; font-size:12.5px; padding:10px 18px; border-radius:26px; flex:0 0 auto;">📄 PSC</button>
</div>
</div>
<!-- FILTER SECTION - FIXED ALWAYS VISIBLE BELOW MAIN BUTTONS -->
<div class="filter-fixed" id="fixedFilter" style="border:2px solid #174a7e; border-radius:14px; box-shadow:0 0 0 3px #dbeafe, 0 6px 18px rgba(0,0,0,.08); background:#fff; padding:12px;">
  <div style="display:flex;justify-content:space-between;align-items:center"><h6 style="color:#174a7e;margin:0;font-size:12px">🎯 Filter</h6><small id="modeLabel" style="color:#0f766e;font-weight:800;font-size:10px">ACTIVE</small></div>
  
  <small style="color:#888;display:block;margin-top:10px;font-size:9px">Filter 1 - Status</small>
  <div class="filter-grid mt-1" style="grid-template-columns:1fr 1fr">
    <button id="cardActive" onclick="setFilterModeCard('active')" class="filter-btn active">🟢 Active</button>
    <button id="cardInactive" onclick="setFilterModeCard('inactive')" class="filter-btn">⚪ Inactive</button>
  </div>
  
  <small style="color:#888;display:block;margin-top:10px;font-size:9px">Filter 2 - Board</small>
  <div class="filter-grid mt-1">
    <button id="boardHindi" onclick="setBoardCard('MP Board (Hindi Medium)')" class="filter-btn">Hindi</button>
    <button id="boardEnglish" onclick="setBoardCard('MP Board (English Medium)')" class="filter-btn">English</button>
    <button id="boardCBSE" onclick="setBoardCard('CBSE')" class="filter-btn">CBSE</button>
  </div>
  
  <small style="color:#888;display:block;margin-top:10px;font-size:9px">Filter 3 - Class</small>
  <div class="filter-grid mt-1" style="grid-template-columns:1fr 1fr 1fr 1fr">
    <button id="class9" onclick="setClassCard('Class 9th')" class="filter-btn">9th</button>
    <button id="class10" onclick="setClassCard('Class 10th')" class="filter-btn">10th</button>
    <button id="class11" onclick="setClassCard('Class 11th')" class="filter-btn">11th</button>
    <button id="class12" onclick="setClassCard('Class 12th')" class="filter-btn">12th</button>
  </div>
</div>

<div class="container-fix">

<!-- HOME -->
<div id="tab-home">
</div>

<!-- STUDENTS - ONLY LIST -->
<div id="tab-students" style="display:none">
  <div class="card p-2 mt-2">
    <div class="d-flex justify-content-between"><h6 style="color:#174a7e;margin:0">👨‍🎓 Student List</h6><small style="color:#666">Filter ऊपर से लागू है</small></div>
    <input id="adminSearch" oninput="filterAdminStudents()" placeholder="🔍 नाम से सर्च..." class="form-control form-control-sm mt-2">
    <div id="studentList" class="mt-2"></div>
  </div>
</div>

<!-- TESTS -->
<div id="tab-tests" style="display:none">
  <div class="card p-2 mt-2">
    <div class="d-flex justify-content-between"><h6 style="color:#174a7e;margin:0">📝 Test Records</h6><div class="d-flex gap-1"><button onclick="addTest()" class="btn btn-sm text-white" style="background:#174a7e">+ Add</button><button onclick="submitPendingTestRecords()" class="btn btn-sm text-white" style="background:#0f766e">Submit</button></div></div>
    <div class="test-table-wrap mt-2"><table class="table table-bordered text-center mb-0" id="testTable"><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
  </div>
</div>

<!-- NOTICE -->
<div id="tab-notice" style="display:none">
  <div class="card p-3 mt-2">
    <h6 style="color:#174a7e">📢 Notice (Filter Students को)</h6>
    <textarea id="noticeMessage" class="form-control form-control-sm mt-2" rows="3" placeholder="Notice लिखें..."></textarea>
    <button onclick="publishNotice()" class="btn w-100 text-white mt-2" style="background:#174a7e">Publish</button>
  </div>
  <div class="card p-2 mt-2">
    <div class="d-flex justify-content-between"><h6 style="color:#174a7e;margin:0;font-size:13px">📜 Remove Notice</h6><button onclick="if(typeof loadNoticesForAdmin==='function') loadNoticesForAdmin()" class="btn btn-sm btn-outline-primary">🔄</button></div>
    <div id="noticeModalContent" class="mt-2"></div>
  </div>
</div>

</div>

<!-- PROFILE -->
<div id="profileOverlay" class="profile-overlay hidden" onclick="if(event.target==this) closeProfile()"><div class="profile-modal-new"><button class="close-btn-new" onclick="closeProfile()">✖</button><div class="profile-left"><img id="pImg" style="width:70px;height:70px;border-radius:50%" src=""><h6 id="pName" class="mt-2" style="color:#174a7e"></h6><small id="pPhone"></small><small id="pBoard"></small><small id="pClass"></small><hr><input type="checkbox" id="dashToggle" onchange="toggleDashboardLock()"><small id="dashStatus"></small></div><div class="profile-right"><div id="subjectBox"></div></div></div></div>
<div class="modal fade" id="reviewModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content"><div class="modal-body"><div id="reviewModalContent"></div></div></div></div></div>

<select id="filterBoard" class="d-none"><option value=""></option><option value="MP Board (Hindi Medium)"></option><option value="MP Board (English Medium)"></option><option value="CBSE"></option></select>
<select id="filterClass" class="d-none"><option value=""></option><option value="Class 9th"></option><option value="Class 10th"></option><option value="Class 11th"></option><option value="Class 12th"></option></select>

<script src="../../config.js"></script>
<script src="admin.js?v=19"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function showTab(name){
  document.getElementById('tab-home').style.display=name=='home'?'block':'none';
  document.getElementById('tab-students').style.display=name=='students'?'block':'none';
  document.getElementById('tab-tests').style.display=name=='tests'?'block':'none';
  document.getElementById('tab-notice').style.display=name=='notice'?'block':'none';
  document.querySelectorAll('.action-btn').forEach(b=>b.classList.remove('active'));
  let map={home:'bH',students:'bK',tests:'bT',notice:'bN'};
  if(map[name]) document.getElementById(map[name]).classList.add('active');
  if(name=='students') filterStudents();
  if(name=='notice' && typeof loadNoticesForAdmin==='function') loadNoticesForAdmin();
  if(['students','tests','notice'].includes(name)){
    setTimeout(()=> window.scrollTo({top:0, behavior:'smooth'}), 80);
  }
}
function setFilterModeCard(m){ setStudentFilterMode(m); cardActive.classList.toggle('active',m=='active'); cardInactive.classList.toggle('active',m=='inactive'); }
function setBoardCard(v){ let s=filterBoard; s.value=s.value==v?'':v; document.querySelectorAll('[id^=board]').forEach(c=>c.classList.remove('active')); if(s.value){ if(v.includes('Hindi')) boardHindi.classList.add('active'); else if(v.includes('English')) boardEnglish.classList.add('active'); else boardCBSE.classList.add('active'); } filterStudents(); }
function setClassCard(v){ let s=filterClass; s.value=s.value==v?'':v; document.querySelectorAll('[id^=class]').forEach(c=>c.classList.remove('active')); if(s.value) document.getElementById('class'+v.match(/\d+/)[0]).classList.add('active'); filterStudents(); }
function filterAdminStudents(){ let q=adminSearch.value.toLowerCase(); document.querySelectorAll('#studentList > div').forEach(d=>{d.style.display=d.innerText.toLowerCase().includes(q)?'':'none'}); }
document.addEventListener('DOMContentLoaded',()=>{ let m=localStorage.getItem('pal_student_mode')||'active'; modeLabel.innerText=m.toUpperCase(); });
</script>

  
</body>
</html>
