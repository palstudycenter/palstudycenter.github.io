<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>पाल स्टडी सेंटर - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#fdf6ee;font-family:Poppins,sans-serif}
.card{border-radius:15px;border:none;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.filter-btn{background:linear-gradient(135deg,#174a7e 0%,#1e6fa5 100%)!important;color:#fff!important;border:none!important;border-radius:10px!important;font-weight:700!important;min-height:44px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;font-size:11px}
.filter-btn.active{background:#fff!important;color:#174a7e!important;border:2px solid #174a7e!important}
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav-btn{background:linear-gradient(135deg,#174a7e 0%,#1e6fa5 100%)!important;color:#fff!important;border:none!important;border-radius:12px!important;font-weight:800!important;min-height:58px!important;font-size:12px!important}
.nav-btn.active{background:#fff!important;color:#174a7e!important;border:2px solid #174a7e!important}
.student-card{background:#fff;border:1px solid #e6eef7;border-radius:12px;padding:10px;width:100%;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.test-table-wrap{overflow:auto;max-height:75vh;border-radius:0 0 12px 12px;border:1px solid #dbeafe;background:#fff}
#testTable thead th{position:sticky;top:0;background:#174a7e!important;color:#fff;font-size:10px;z-index:1}
.profile-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:center;z-index:9999;padding:12px}
.profile-modal-new{width:100%;max-width:520px;max-height:90vh;background:#fff;border-radius:20px;display:flex;overflow:hidden;position:relative}
.profile-left{width:38%;background:#f8fafc;border-right:1px solid #eef2f7;padding:16px;text-align:center;overflow-y:auto}
.profile-right{width:62%;padding:16px;overflow-y:auto}
.close-btn-new{position:absolute;top:8px;right:10px;border:none;background:#f1f5f9;border-radius:50%;width:30px;height:30px}
.hidden{display:none!important}
.container-fix{max-width:520px;margin:auto;padding:12px}
#studentList{max-height:65vh;overflow-y:auto}
</style>
</head>
<body>
<div class="container-fix">

<div id="filterWrap">
  <div class="card p-2" style="border:1.5px solid #174a7e">
    <div class="nav-grid">
      <button id="bK" onclick="showTab('students')" class="filter-btn nav-btn">👨‍🎓<br>स्टूडेंट प्रोफाइल</button>
      <button id="bT" onclick="showTab('tests')" class="filter-btn nav-btn">📝<br>टेस्ट रिकॉर्ड</button>
      <button id="bN" onclick="showTab('notice')" class="filter-btn nav-btn">📢<br>नोटिस</button>
      <button id="bR" onclick="openReviewsPopup(event)" class="filter-btn nav-btn">⭐<br>रिव्यू</button>
    </div>
    <hr style="margin:12px 0 10px 0; border:none; border-top:2px solid #174a7e; opacity:0.4;">
    <div style="display:flex;justify-content:space-between;align-items:center"><h6 style="color:#174a7e;margin:0;font-size:12px">🎯 Filter</h6><small id="modeLabel" style="color:#0f766e;font-weight:800;font-size:10px">ACTIVE</small></div>
    <small style="color:#1e293b;display:block;margin-top:6px;font-size:10px;font-weight:800">Filter 1 - Status</small>
    <div class="filter-grid mt-1" style="grid-template-columns:1fr 1fr">
      <button id="cardActive" onclick="setFilterModeCard('active')" class="filter-btn active">🟢 Active</button>
      <button id="cardInactive" onclick="setFilterModeCard('inactive')" class="filter-btn">⚪ Inactive</button>
    </div>
    <small style="color:#1e293b;display:block;margin-top:6px;font-size:10px;font-weight:800">Filter 2 - Board</small>
    <div class="filter-grid mt-1">
      <button id="boardHindi" onclick="setBoardCard('MP Board (Hindi Medium)')" class="filter-btn">Hindi</button>
      <button id="boardEnglish" onclick="setBoardCard('MP Board (English Medium)')" class="filter-btn">English</button>
      <button id="boardCBSE" onclick="setBoardCard('CBSE')" class="filter-btn">CBSE</button>
    </div>
    <small style="color:#1e293b;display:block;margin-top:6px;font-size:10px;font-weight:800">Filter 3 - Class</small>
    <div class="filter-grid mt-1" style="grid-template-columns:1fr 1fr 1fr 1fr">
      <button id="class9" onclick="setClassCard('Class 9th')" class="filter-btn" style="min-height:36px!important">9th</button>
      <button id="class10" onclick="setClassCard('Class 10th')" class="filter-btn" style="min-height:36px!important">10th</button>
      <button id="class11" onclick="setClassCard('Class 11th')" class="filter-btn" style="min-height:36px!important">11th</button>
      <button id="class12" onclick="setClassCard('Class 12th')" class="filter-btn" style="min-height:36px!important">12th</button>
    </div>
  </div>
</div>

<div id="listWrap" style="display:none">
  <div class="card p-3">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <button onclick="backToFilter()" class="btn btn-sm text-white" style="background:#174a7e;border-radius:20px;font-size:11px">⬅️ बैक</button>
      <h6 id="listTitle" style="color:#174a7e;margin:0;font-size:13px;font-weight:800"></h6>
      <span style="width:50px"></span>
    </div>
    <div id="tab-students" style="display:none">
      <input id="adminSearch" oninput="filterAdminStudents()" placeholder="🔍 नाम से सर्च..." class="form-control form-control-sm">
      <div id="studentList" class="mt-2"></div>
    </div>
    <div id="tab-tests" style="display:none">
      <div class="d-flex justify-content-between mb-2"><h6 style="color:#174a7e;margin:0">📝 Test Records</h6><div class="d-flex gap-1"><button onclick="addTest()" class="btn btn-sm text-white" style="background:#174a7e">+ Add</button><button onclick="submitPendingTestRecords()" class="btn btn-sm text-white" style="background:#0f766e">Submit</button></div></div>
      <div class="test-table-wrap"><table class="table table-bordered text-center mb-0" id="testTable"><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div>
    </div>
    <div id="tab-notice" style="display:none">
      <h6 style="color:#174a7e">📢 Notice (Filter Students को)</h6>
      <textarea id="noticeMessage" class="form-control form-control-sm mt-2" rows="3" placeholder="Notice लिखें..."></textarea>
      <button onclick="publishNotice()" class="btn w-100 text-white mt-2" style="background:#174a7e">Publish</button>
      <div class="mt-3"><div class="d-flex justify-content-between"><h6 style="font-size:13px">📜 Remove Notice</h6><button onclick="if(typeof loadNoticesForAdmin==='function') loadNoticesForAdmin()" class="btn btn-sm btn-outline-primary">🔄</button></div><div id="noticeModalContent" class="mt-2" style="white-space:pre-wrap; word-break:break-word; max-height:50vh; overflow-y:auto;"></div></div>
    </div>
  </div>
</div>

<div id="tab-home" style="display:none"></div>

</div>

<div id="profileOverlay" class="profile-overlay hidden" onclick="if(event.target==this) closeProfile()"><div class="profile-modal-new"><button class="close-btn-new" onclick="closeProfile()">✖</button><div class="profile-left"><img id="pImg" style="width:70px;height:70px;border-radius:50%" src=""><h6 id="pName" class="mt-2" style="color:#174a7e"></h6><small id="pPhone"></small><small id="pBoard"></small><small id="pClass"></small><hr><input type="checkbox" id="dashToggle" onchange="toggleDashboardLock()"><small id="dashStatus"></small></div><div class="profile-right"><div id="subjectBox"></div></div></div></div>
<div class="modal fade" id="reviewModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content"><div class="modal-body"><div id="reviewModalContent"></div></div></div></div></div>
<select id="filterBoard" class="d-none"><option value=""></option><option value="MP Board (Hindi Medium)"></option><option value="MP Board (English Medium)"></option><option value="CBSE"></option></select>
<select id="filterClass" class="d-none"><option value=""></option><option value="Class 9th"></option><option value="Class 10th"></option><option value="Class 11th"></option><option value="Class 12th"></option></select>
<script src="../../config.js"></script>
<script src="admin.js?v=19"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function backToFilter(){
  document.getElementById('filterWrap').style.display='block';
  document.getElementById('listWrap').style.display='none';
  document.getElementById('tab-students').style.display='none';
  document.getElementById('tab-tests').style.display='none';
  document.getElementById('tab-notice').style.display='none';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
}
function showTab(name){
  if(name=='home') return;
  document.getElementById('filterWrap').style.display='none';
  document.getElementById('listWrap').style.display='block';
  document.getElementById('tab-students').style.display=name=='students'?'block':'none';
  document.getElementById('tab-tests').style.display=name=='tests'?'block':'none';
  document.getElementById('tab-notice').style.display=name=='notice'?'block':'none';
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  let map={students:'bK',tests:'bT',notice:'bN'};
  if(map[name]) document.getElementById(map[name]).classList.add('active');
  let titles={students:'स्टूडेंट प्रोफाइल',tests:'टेस्ट रिकॉर्ड',notice:'नोटिस'};
  document.getElementById('listTitle').innerText=titles[name]||'';
  if(name=='students') filterStudents();
  if(name=='notice' && typeof loadNoticesForAdmin==='function') loadNoticesForAdmin();
}
function setFilterModeCard(m){ setStudentFilterMode(m); cardActive.classList.toggle('active',m=='active'); cardInactive.classList.toggle('active',m=='inactive'); }
function setBoardCard(v){ let s=filterBoard; s.value=s.value==v?'':v; document.querySelectorAll('[id^=board]').forEach(c=>c.classList.remove('active')); if(s.value){ if(v.includes('Hindi')) boardHindi.classList.add('active'); else if(v.includes('English')) boardEnglish.classList.add('active'); else boardCBSE.classList.add('active'); } filterStudents(); }
function setClassCard(v){ let s=filterClass; s.value=s.value==v?'':v; document.querySelectorAll('[id^=class]').forEach(c=>c.classList.remove('active')); if(s.value) document.getElementById('class'+v.match(/\d+/)[0]).classList.add('active'); filterStudents(); }
function filterAdminStudents(){ let q=adminSearch.value.toLowerCase(); document.querySelectorAll('#studentList > div').forEach(d=>{d.style.display=d.innerText.toLowerCase().includes(q)?'':'none'}); }
document.addEventListener('DOMContentLoaded',()=>{ let m=localStorage.getItem('pal_student_mode')||'active'; if(document.getElementById('modeLabel')) modeLabel.innerText=m.toUpperCase(); });
</script>
</body>
</html>
