function checkObjectMatch(verbBase, obj){
let v=(verbBase||"").toLowerCase().replace("to ","").trim();
let o=(obj||"").toLowerCase().trim();
if(!o) return "⚠️ Object खाली है";
if(/[अ-ह]/.test(o)) return "⚠️ Object English में लिखो";
if(o.split(" ").length>6) return "⚠️ Object बहुत लंबा";
if(/can|could|should|must|will|would|may|might|have to|has to/.test(o)) return "❌ Object में Modal नहीं आता";
let grp = Object.keys(VERB_GROUPS).find(k=>VERB_GROUPS[k].includes(v)) || "common";
if(grp==="motion" && /english|hindi|food|book|lesson|math/.test(o)) return `❌ गलत: '${v}' = जगह चाहिए, '${o}' नहीं`;
if(grp==="learning" && /to school|to home|to market/.test(o)) return `❌ गलत: '${v}' = Skill चाहिए, जगह नहीं`;
return `✅ Structure Match: ${v} + ${o}`;
}

function getV2(v1){
let m={go:"went",eat:"ate",speak:"spoke",write:"wrote",come:"came",do:"did",make:"made",take:"took",give:"gave",teach:"taught",buy:"bought",bring:"brought",think:"thought",get:"got",find:"found",read:"read",run:"ran",know:"knew",sleep:"slept",sell:"sold",pay:"paid",tell:"told",keep:"kept",put:"put",drink:"drank",work:"worked"};
return m[v1]||v1+"ed";
}
function getV1s(v1,sub){
if(!["He","She","It","Ram"].includes(sub)) return v1;
if(v1==="have") return "has";
if(v1.endsWith('y') && !/[aeiou]y$/.test(v1)) return v1.slice(0,-1)+'ies';
if(/(s|sh|ch|x|o)$/.test(v1)) return v1+'es';
return v1+'s';
}

function updateModalInfo(){
let k=document.getElementById('modModal').value;
let m=MODAL_LIST.find(x=>x.key===k);
document.getElementById('modRule').innerHTML=`<b style="color:#7c3aed">${esc(m.key)}</b><br>🇬🇧 ${esc(m.use)}<br>🇮🇳 ${esc(m.hi)}`;
refreshModalAuto();
let vs=document.getElementById('modVerb');vs.innerHTML="";
VERBS.forEach(v=>{let txt=v.v1;if(m.form==="v3")txt=v.v3;if(m.form==="ving")txt=v.ving;if(m.form==="to_v1")txt=v.to;let o=document.createElement('option');o.value=txt;o.textContent=txt;vs.appendChild(o);});
}
function refreshModalAuto(){
let k=document.getElementById('modModal').value;
let sub=document.getElementById('modSub')?.value||"I";
let display=k;
if(k==="Has to / Have to"){
let singular=["He","She","It","My father","Ram"];
display = singular.includes(sub) ? "has to" : "have to";
}else if(k.toLowerCase().includes("be ")){
let be = sub==="I" ? "am" : (["He","She","It","My father","Ram"].includes(sub) ? "is" : "are");
let rest = k.toLowerCase().replace("be ","");
display = be + " " + rest;
}
document.getElementById('modAuto').innerHTML=`<option>${esc(display)}</option>`;
document.getElementById('modAuto').dataset.real=display;
}
async function makeModalSentence(){
let sub=document.getElementById('modSub').value;
let verb=document.getElementById('modVerb').value;
let obj=document.getElementById('modObj').value.trim()||"daily";
let real=document.getElementById('modAuto').dataset.real||"";
let baseVerb = verb.replace("to ","").trim();
let checkMsg = checkObjectMatch(baseVerb, obj);
let eng=`${sub} ${real} ${verb} ${obj}`.replace(/\s+/g,' ').trim();
if(!eng.endsWith('.'))eng+='.';
let hiTrans=getCache()[eng] || "Translating...";
document.getElementById('modOut').innerHTML=`<div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:12px;padding:12px"><div style="font-size:11px;font-weight:800;color:#15803d">✅ Your Sentence:</div><div style="font-weight:900;font-size:15px;margin-top:6px">${esc(eng)}</div><div style="font-size:13px;color:#174a7e;margin-top:6px;white-space:pre-wrap">🇮🇳 ${esc(hiTrans)}</div><div style="font-size:11px;margin-top:8px;padding:8px;background:#fff;border-radius:8px;border:1px dashed ${checkMsg.startsWith('✅')?'#bbf7d0':'#fca5a5'};font-weight:800">${checkMsg}</div><div style="display:flex;gap:6px;margin-top:10px"><button onclick="speakLoud('${eng.replace(/'/g,"\\'")}')" style="flex:1;border:none;background:#fff;border:1.5px solid #bbf7d0;padding:9px;border-radius:8px;font-weight:700">📢 Loud</button><button onclick="shareMsg('${eng.replace(/'/g,"\\'")}')" style="flex:1;border:none;background:#e0f2fe;padding:9px;border-radius:8px;font-weight:700">📤 Share</button><button id="saveBtn" onclick="quickSaveModal('${eng.replace(/'/g,"\\'")}')" style="flex:1;border:none;background:#15803d;color:#fff;padding:9px;border-radius:8px;font-weight:800">💾 Save</button></div></div>`;
speakLoud(eng);
if(!getCache()[eng]){
try{
let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(eng)}&langpair=en|hi`);
let j=await r.json();
let hi=j.responseData.translatedText;
setCache(eng,hi);
let out=document.getElementById('modOut');
if(out) out.innerHTML = out.innerHTML.replace(esc(hiTrans), esc(hi));
window._lastHi=hi;
document.getElementById('saveBtn').setAttribute('onclick',`quickSaveModal('${eng.replace(/'/g,"\\'")}','${hi.replace(/'/g,"\\'")}')`);
}catch(e){}
}
}
function quickSaveModal(e,hi){lastTransH=hi||window._lastHi||"Modals Lab";lastTransE=e;openPoll();}
function getTicks(){let k='daily_tick_'+new Date().toISOString().slice(0,10);return JSON.parse(localStorage.getItem(k)||'[false,false,false,false,false]');}
function saveTick(i){let k='daily_tick_'+new Date().toISOString().slice(0,10);let t=getTicks();t[i]=!t[i];localStorage.setItem(k,JSON.stringify(t));renderAll();}
function getDaily5(){let idx=new Date().getDate()%DAILY_POOL.length;let list=[];for(let i=0;i<5;i++)list.push(DAILY_POOL[(idx+i)%DAILY_POOL.length]);return list;}

function renderAll(){

function speakByIdx(i){let db=getDB();if(db[i])speakLoud(db[i].e);}
function shareByIdx(i){let db=getDB();if(db[i])shareMsg(db[i].e);}
function selectCat(cat){selectedCat=cat;document.querySelectorAll('.pollOpt').forEach(o=>{o.classList.remove('sel');o.querySelector('span:last-child').innerText='○';});let el=document.getElementById('opt-'+cat);el.classList.add('sel');el.querySelector('span:last-child').innerText='●';}
function openPoll(){pendingH=lastTransH;pendingE=lastTransE;document.getElementById('pollPreview').innerHTML=`<b>${esc(pendingE)}</b><div style="color:#64748b;margin-top:4px">${esc(pendingH)}</div>`;selectCat('my');document.getElementById('catPoll').classList.add('show');}
function closePoll(){document.getElementById('catPoll').classList.remove('show');}
function confirmSave(){let db=getDB();if(db.some(x=>x.e===pendingE)){alert('Already saved!');closePoll();return;}db.push({h:pendingH,e:pendingE,cat:selectedCat,time:Date.now()});saveDB(db);closePoll();document.getElementById('transRes').style.display='none';document.getElementById('hiInp').value='';document.getElementById('saveMsg').style.display='block';document.getElementById('saveMsg').innerText=`✅ Saved to ${selectedCat} (Auto Delete 24h)`;setTimeout(()=>document.getElementById('saveMsg').style.display='none',3000);openSec(selectedCat);}
async function doTrans(){let hi=document.getElementById('hiInp').value.trim();if(!hi)return;document.getElementById('transRes').style.display='block';document.getElementById('transRes').innerHTML='Translating...';let en=hi;try{let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(hi)}&langpair=hi|en`);let j=await r.json();en=j.responseData.translatedText;}catch(e){}lastTransH=hi;lastTransE=en;document.getElementById('transRes').innerHTML=`<div style="font-weight:900;font-size:14px;white-space:pre-wrap">${esc(en)}</div><div style="font-size:11px;color:#64748b;margin-top:4px;white-space:pre-wrap">${esc(hi)}</div><div style="display:flex;gap:6px;margin-top:10px"><button onclick="speakLoud(lastTransE)" style="flex:1;border:none;background:#fff;padding:8px;border-radius:8px;font-weight:700;border:1px solid #bbf7d0">📢 Loud</button><button onclick="shareMsg(lastTransE)" style="flex:1;border:none;background:#e0f2fe;padding:8px;border-radius:8px;font-weight:700">📤 Share</button><button onclick="openPoll()" style="flex:1;border:none;background:#174a7e;color:#fff;padding:8px;border-radius:8px;font-weight:800">💾 Save</button></div>`;speakLoud(en);}
function speakLoud(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
function shareMsg(t){if(navigator.share){navigator.share({text:t});}else{navigator.clipboard.writeText(t);alert('Copied');}}
function clearAll(){if(!confirm('Clear All?'))return;localStorage.removeItem(KEY);renderAll();goHome();}
renderAll();
