function updateBeHaveInfo(){let k=document.getElementById('behaveType').value;let m=BEHAVE_LIST.find(x=>x.key===k);document.getElementById('behaveRule').innerHTML=`<b style="color:#7c3aed">${esc(m.key)}</b><br>🇬🇧 ${esc(m.use)}<br>🇮🇳 ${esc(m.hi)}`;let objSel=document.getElementById('behaveObj');objSel.innerHTML="";let list = BEHAVE_OBJ_FILTER[m.form] || ["happy","at home"];list.forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;objSel.appendChild(o);});syncBeHave();}
function syncBeHave(){let sub=document.getElementById('behaveSub').value.toLowerCase();let k=document.getElementById('behaveType').value;let m=BEHAVE_LIST.find(x=>x.key===k);let form=m.be;if(m.key==="am/is/are"){if(sub==='i') form='am'; else if(sub==='he'||sub==='she'||sub==='ram') form='is'; else form='are';}else if(m.key==="was/were"){if(sub==='i'||sub==='he'||sub==='she'||sub==='ram') form='was'; else form='were';}else if(m.key==="have/has"){if(sub==='he'||sub==='she'||sub==='ram') form='has'; else form='have';}document.getElementById('behaveBe').innerHTML=`<option>${form}</option>`;document.getElementById('behaveBe').dataset.real=form;}
async function makeBeHaveSentence(){let k=document.getElementById('behaveType').value;let sub=document.getElementById('behaveSub').value;let be=document.getElementById('behaveBe').dataset.real;let obj=document.getElementById('behaveObj').value;let m=BEHAVE_LIST.find(x=>x.key===k); let eng="";if(m.form==="be_present"||m.form==="be_past"){eng=`${sub} ${be} ${obj}`;}else if(m.form==="be_base"){eng=`${sub} will ${be} ${obj}`;}else if(m.form==="be_being"){eng=`${sub} is ${be} ${obj}`;}else if(m.form==="be_been"){let aux=(['he','she','ram'].includes(sub.toLowerCase()))?'has':'have';eng=`${sub} ${aux} ${be} ${obj}`;}else if(m.form==="have_present"||m.form==="have_past"){eng=`${sub} ${be} ${obj}`;}else if(m.form==="have_ing"){let aux=(sub.toLowerCase()==='i')?'am':(['he','she','ram'].includes(sub.toLowerCase()))?'is':'are';eng=`${sub} ${aux} ${be} ${obj}`;}else if(m.form==="have_base"||m.form==="have_light"){eng=`${sub} ${be} ${obj}`;}if(m.form==="have_base") eng=`${sub} will ${be} ${obj}`;eng=eng.replace(/\s+/g,' ').trim(); eng=eng.charAt(0).toUpperCase()+eng.slice(1)+".";let cache=getCache(); let hiTrans=cache[eng]||"Translating...";document.getElementById('behaveOut').innerHTML=`<div style="background:#f5f3ff;border:1.5px solid #ddd6fe;border-radius:12px;padding:12px"><div style="font-weight:900;font-size:15px">${esc(eng)}</div><div style="font-size:13px;color:#174a7e;margin-top:6px">🇮🇳 ${esc(hiTrans)}</div><div style="display:flex;gap:6px;margin-top:10px"><button onclick="speakLoud('${eng.replace(/'/g,"\\'")}')" style="flex:1;border:1.5px solid #ddd6fe;background:#fff;padding:9px;border-radius:8px;font-weight:700">📢 Loud</button><button onclick="shareMsg('${eng.replace(/'/g,"\\'")}')" style="flex:1;border:none;background:#e0f2fe;padding:9px;border-radius:8px;font-weight:700">📤 Share</button><button id="behaveSaveBtn" onclick="quickSaveModal('${eng.replace(/'/g,"\\'")}')" style="flex:1;background:#7c3aed;color:#fff;border:none;padding:9px;border-radius:8px;font-weight:800">💾 Save</button></div></div>`;speakLoud(eng);if(!cache[eng]){try{let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(eng)}&langpair=en|hi`);let j=await r.json();let hi=j.responseData.translatedText;setCache(eng,hi);document.querySelector('#behaveOut div div:nth-child(2)').innerText='🇮🇳 '+hi;window._lastHi=hi;document.getElementById('behaveSaveBtn').setAttribute('onclick',`quickSaveModal('${eng.replace(/'/g,"\\'")}','${hi.replace(/'/g,"\\'")}')`);}catch(e){}}}

function quickSaveModal(e,hi){lastTransH=hi||window._lastHi||"Lab";lastTransE=e;openPoll();}
function renderAll(){let db=getDB();let filt=c=>db.filter((it)=>it.cat===c);document.getElementById('sec-coaching').innerHTML=filt('coaching').map((it)=>{let idx=db.indexOf(it);return cardHTML(it,idx);}).join('')||'<div style="padding:30px;text-align:center;color:#94a3b8">Empty</div>';document.getElementById('sec-family').innerHTML=filt('family').map((it)=>{let idx=db.indexOf(it);return cardHTML(it,idx);}).join('')||'<div style="padding:30px;text-align:center;color:#94a3b8">Empty</div>';document.getElementById('sec-friends').innerHTML=filt('friends').map((it)=>{let idx=db.indexOf(it);return cardHTML(it,idx);}).join('')||'<div style="padding:30px;text-align:center;color:#94a3b8">Empty</div>';document.getElementById('sec-my').innerHTML=filt('my').map((it)=>{let idx=db.indexOf(it);return cardHTML(it,idx);}).join('')||'<div style="padding:30px;text-align:center;color:#94a3b8">Empty</div>';document.getElementById('myCount').innerText=db.length;}
function speakByIdx(i){let db=getDB();if(db[i])speakLoud(db[i].e);}function shareByIdx(i){let db=getDB();if(db[i])shareMsg(db[i].e);}function selectCat(cat){selectedCat=cat;document.querySelectorAll('.pollOpt').forEach(o=>{o.classList.remove('sel');o.querySelector('span:last-child').innerText='○';});let el=document.getElementById('opt-'+cat);el.classList.add('sel');el.querySelector('span:last-child').innerText='●';}
function openPoll(){pendingH=lastTransH;pendingE=lastTransE;document.getElementById('pollPreview').innerHTML=`<b>${esc(pendingE)}</b><div style="color:#64748b;margin-top:4px">${esc(pendingH)}</div>`;selectCat('my');document.getElementById('catPoll').classList.add('show');}
function closePoll(){document.getElementById('catPoll').classList.remove('show');}
function confirmSave(){let db=getDB();if(db.some(x=>x.e===pendingE)){alert('Already saved!');closePoll();return;}db.push({h:pendingH,e:pendingE,cat:selectedCat,time:Date.now()});saveDB(db);closePoll();document.getElementById('transRes').style.display='none';document.getElementById('hiInp').value='';document.getElementById('saveMsg').style.display='block';document.getElementById('saveMsg').innerText=`✅ Saved to ${selectedCat} (Auto Delete 24h)`;setTimeout(()=>document.getElementById('saveMsg').style.display='none',3000);openSec(selectedCat);}
async function doTrans(){let hi=document.getElementById('hiInp').value.trim();if(!hi)return;document.getElementById('transRes').style.display='block';document.getElementById('transRes').innerHTML='Translating...';let en=hi;try{let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(hi)}&langpair=hi|en`);let j=await r.json();en=j.responseData.translatedText;}catch(e){}lastTransH=hi;lastTransE=en;document.getElementById('transRes').innerHTML=`<div style="font-weight:900;font-size:14px;white-space:pre-wrap">${esc(en)}</div><div style="font-size:11px;color:#64748b;margin-top:4px;white-space:pre-wrap">${esc(hi)}</div><div style="display:flex;gap:6px;margin-top:10px"><button onclick="speakLoud(lastTransE)" style="flex:1;border:none;background:#fff;border:1.5px solid #bbf7d0;padding:9px;border-radius:8px;font-weight:700">📢 Loud</button><button onclick="shareMsg(lastTransE)" style="flex:1;border:none;background:#e0f2fe;padding:9px;border-radius:8px;font-weight:700">📤 Share</button><button onclick="quickSaveModal(lastTransE,lastTransH)" style="flex:1;border:none;background:#174a7e;color:#fff;padding:9px;border-radius:8px;font-weight:800">💾 Save</button></div>`;speakLoud(en);}
function speakLoud(t){if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u);}}
function shareMsg(t){if(navigator.share){navigator.share({text:t});}else{navigator.clipboard.writeText(t);alert('Copied!');}}
function clearAll(){if(confirm('Clear All?')){localStorage.removeItem(KEY);renderAll();}}
function startHiMic(){if(location.protocol==='file:'){alert('Direct File में Mic Block है।');document.getElementById('hiInp').focus();return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Chrome में खोलो');return;}let rec=new SR();rec.lang='hi-IN';document.getElementById('micBtn').innerText='🔴';rec.onresult=(e)=>{document.getElementById('hiInp').value=e.results[0][0].transcript;doTrans();};rec.onend=()=>{document.getElementById('micBtn').innerText='🎤';};rec.start();}
renderAll();
</script>
</body>
</html>
