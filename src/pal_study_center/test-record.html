<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Records</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#f1f5f9;font-family:Inter,system-ui;padding-top:70px;}
.top-nav{position:fixed;top:0;width:100%;background:#fff;border-bottom:1px solid #e2e8f0;z-index:99;padding:12px 0;}
.kpi{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px 20px;height:80px;}
.kpi .icon{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex-shrink:0;}
.kpi h3{margin:0;font-weight:800;font-size:18px;}
.kpi p{margin:0;font-size:11px;color:#64748b;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;}
.box-head{padding:18px 22px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;}
.tbl thead th{background:#f8fafc!important;color:#475569!important;font-size:11px!important;letter-spacing:.8px;text-transform:uppercase;padding:12px!important;border-bottom:1px solid #e2e8f0!important;}
.tbl tbody td{padding:14px 12px!important;font-size:14px;border-bottom:1px solid #f8fafc;}
.score{font-weight:800;padding:4px 10px;border-radius:20px;font-size:13px;}
.score.good{background:#dcfce7;color:#15803d;}
.score.mid{background:#fef9c3;color:#a16207;}
.score.bad{background:#fee2e2;color:#b91c1c;}
.score.null{background:#f1f5f9;color:#94a3b8;}
.graph-box{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;}
.hl-line{display:flex;justify-content:space-between;width:100%;font-size:13px;font-weight:700;}
</style>
</head>
<body>
<div class="top-nav"><div class="container d-flex justify-content-between"><a href="student-dashboard.html" class="text-decoration-none fw-bold text-dark"><i class="bi bi-arrow-left-short"></i> Dashboard</a><span class="fw-bold" style="color:#174a7e;">Test Records</span></div></div>

<div class="container">
<div class="row g-3 mb-3">
  <div class="col-6 col-lg-3"><div class="kpi"><div class="icon" style="background:#fef9c3;color:#a16207;"><i class="bi bi-lightning-charge-fill"></i></div><div><p>Latest Test</p><h3 id="myLat">-/20</h3><small id="myLatName" style="font-size:10px;color:#64748b;font-weight:600;">No Test</small></div></div></div>
  <div class="col-6 col-lg-3"><div class="kpi"><div class="icon" style="background:#dbeafe;color:#174a7e;"><i class="bi bi-bullseye"></i></div><div><p>Average</p><h3 id="myPer">0%</h3></div></div></div>
  <div class="col-6 col-lg-3"><div class="kpi"><div class="icon" style="background:#f3e8ff;color:#7e22ce;"><i class="bi bi-collection"></i></div><div><p>Attempted</p><h3 id="myAttempt">0/0</h3><small id="myAttemptPer" style="font-size:10px;color:#64748b;font-weight:600;">0% Done</small></div></div></div>
  <div class="col-6 col-lg-3"><div class="kpi"><div class="icon" style="background:#dcfce7;color:#15803d;"><i class="bi bi-bar-chart-line-fill"></i></div><div style="width:100%;"><p>Score Range</p><div class="hl-line"><span style="color:#15803d;" id="myHigh">High: -</span><span style="color:#b91c1c;" id="myLow">Low: -</span></div></div></div></div>
</div>

<div class="box mb-3">
<div class="box-head"><h6 class="m-0 fw-bold">All Test</h6><small class="text-muted"><span id="myLatName2"></span> • <span id="myAttemptPer2"></span></small></div>
<div class="table-responsive"><table class="table tbl text-center m-0"><thead><tr id="h2"></tr></thead><tbody id="b2"></tbody></table></div>
</div>

<div class="graph-box">
<h6 class="fw-bold mb-3"><i class="bi bi-graph-up-arrow me-2" style="color:#174a7e;"></i>Performance Graph</h6>
<canvas id="testChart" height="120"></canvas>
</div>
</div>

<script src="../../config.js"></script>
<script>
// ===== SAME WORKING FUNCTION - NO TOUCH =====
let user = JSON.parse(localStorage.getItem("currentUser") || localStorage.getItem("pal_current_user") || '{"name":"Test","class":"Class 10th","id":"1"}');
function normalizeTestRecords(raw = {}) {
  const normalized = {};
  Object.entries(raw || {}).forEach(([key, value]) => {
    const label = String(key || '').trim();
    let numKey = Number(label);
    if (Number.isNaN(numKey) && /^T\d+$/i.test(label)) numKey = Number(label.replace(/^T/i, ''));
    const cleanValue = Number(value);
    if (!Number.isNaN(numKey) && !Number.isNaN(cleanValue)) normalized[numKey] = cleanValue;
  });
  return normalized;
}
async function loadStudentTestRecords() {
  const studentId = user && user.id ? Number(user.id) : null;
  const savedRecords = JSON.parse(localStorage.getItem('pal_student_test_records') || '{}');
  if (studentId) {
    try {
      const response = await fetch(`${CONFIG.BASE_URL}/students/${studentId}/test-records`);
      const data = await response.json();
      if (response.ok && data.status && data.res && typeof data.res === 'object') {
        localStorage.setItem('pal_student_test_records', JSON.stringify(data.res));
        return data.res;
      }
    } catch (error) {}
  }
  return savedRecords;
}
async function renderAll(){
  let records = await loadStudentTestRecords();
  let TM = normalizeTestRecords(records);
  let TC = Math.max(1, ...Object.keys(TM).map(Number), 1);
  let perTotal=0,count=0,lat='-',latName='No Test';
  let labels=[], scores=[];
  Object.entries(TM).forEach(([k,v])=>{ if(v!=='' && v!=null && !isNaN(v)){ perTotal+=Number(v); count++; lat=v; latName='T'+k; }});
  const avg = count ? (perTotal/(count*20))*100 : 0;
  document.getElementById('myPer').innerText=avg.toFixed(1)+'%';
  document.getElementById('myLat').innerText=lat!='-'?lat+'/20':'-/20';
  document.getElementById('myLatName').innerText=latName;
  document.getElementById('myLatName2').innerText=latName;
  document.getElementById('myAttempt').innerText=count+'/'+TC;
  document.getElementById('myAttemptPer').innerText=(TC? (count/TC*100).toFixed(0):0)+'% Done';
  document.getElementById('myAttemptPer2').innerText=(TC? (count/TC*100).toFixed(0):0)+'% Done';

  let validScores = Object.entries(TM).filter(([k,v])=> v!=null && !isNaN(v)).map(([k,v])=> Number(v));
  if(validScores.length > 0){
    document.getElementById('myHigh').innerText = `High: ${Math.max(...validScores)}/20`;
    document.getElementById('myLow').innerText = `Low: ${Math.min(...validScores)}/20`;
  }

  let h='<th style="text-align:left;min-width:160px;">STUDENT</th>';
  for(let i=1;i<=TC;i++) h+=`<th>T${i}</th>`;
  document.getElementById('h2').innerHTML=h;
  let html=`<tr><td style="text-align:left;font-weight:700;">${user.name || 'Student'}</td>`;
  for(let k=1;k<=TC;k++){ 
    let v=TM[k]; 
    labels.push('T'+k);
    scores.push(v!=null ? v : null);
    if(v==null || v==='') html+=`<td><span class="score null">-</span></td>`; 
    else if(v>=14) html+=`<td><span class="score good">${v}</span></td>`; 
    else if(v>=8) html+=`<td><span class="score mid">${v}</span></td>`; 
    else html+=`<td><span class="score bad">${v}</span></td>`; 
  }
  html+='</tr>';
  document.getElementById('b2').innerHTML=html;

  new Chart(document.getElementById('testChart'), {
    type: 'line',
    data: { labels: labels, datasets: [{ label: 'Score /20', data: scores, borderColor: '#174a7e', backgroundColor: 'rgba(23,74,126,0.12)', borderWidth: 3, tension: 0.4, fill: true, pointBackgroundColor: scores.map(v => v==null ? '#cbd5e1' : v>=14 ? '#15803d' : v>=8 ? '#a16207' : '#dc2626'), pointRadius: 5, spanGaps: true }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: 20, grid: { color: '#f1f5f9' }, ticks: { stepSize: 4 } }, x: { grid: { display: false } } } }
  });
}
renderAll();
</script>
</body></html>
