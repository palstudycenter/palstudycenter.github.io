<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test Records</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body style="padding-top:70px;background:#f4f7ff;font-family:Poppins;">
<nav style="background:#174a7e;padding:12px;"><a href="student-dashboard.html" style="color:#fff;font-weight:700;text-decoration:none;">← Dashboard</a></nav>
<div class="container mt-3"><div class="card p-3"><h5>🏆 Ranking (Same Class)</h5><div class="table-responsive"><table class="table table-bordered"><thead><tr id="h2"></tr></thead><tbody id="b2"></tbody></table></div></div></div>
<script>
let user=JSON.parse(localStorage.getItem("currentUser")); let TC=localStorage.getItem('tc')||5; let TM=JSON.parse(localStorage.getItem('tm')||'{}');
let allStudents=JSON.parse(localStorage.getItem('pal_students_list_cache')||'[]');
if(!allStudents.length) allStudents=[{id:user.id||1, name:user.name, class:user.class}];
let data=allStudents.filter(s=>s.class==user.class).map(s=>{
 let m=TM[s.id]||{}; let tot=0,c=0,lat='-'; let ln='';
 for(let k=1;k<=TC;k++){ if(m[k]!=''&&m[k]!=null){tot+=+m[k];c++;lat=m[k];ln='T'+k;} }
 return {...s, per:c?tot/(c*20)*100:0, lat, ln, m};
}).sort((a,b)=>b.per-a.per);
let h='<th>Rank</th><th>Name</th><th>%</th><th>Latest</th>'; for(let i=1;i<=TC;i++) h+=`<th>T${i}</th>`; document.getElementById('h2').innerHTML=h;
let html=''; data.forEach((r,i)=>{ let me=r.name==user.name?'style="background:#dbeafe;font-weight:700;"':''; html+=`<tr ${me}><td>${i+1}</td><td>${r.name}</td><td>${r.per.toFixed(1)}%</td><td>${r.lat}/20 ${r.ln}</td>`; for(let k=1;k<=TC;k++) html+=`<td>${r.m[k]||'-'}</td>`; html+='</tr>'; });
document.getElementById('b2').innerHTML=html;
</script></body></html>
