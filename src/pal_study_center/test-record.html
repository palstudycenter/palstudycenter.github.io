<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Records</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{padding-top:70px;background:#f4f7ff;font-family:'Poppins',sans-serif;}
/* ===== NEW PROFESSIONAL CARDS ===== */
.top-card{border-radius:16px; border:0; box-shadow:0 8px 20px rgba(0,0,0,.08); height:92px; display:flex; align-items:center; color:#fff; border:1px solid rgba(255,255,255,.15);}
.top-card.rank{background:linear-gradient(135deg,#174a7e,#2b7ac0);}
.top-card.per{background:linear-gradient(135deg,#0f766e,#14b8a6);}
.top-card.latest{background:linear-gradient(135deg,#7c3aed,#a78bfa);}
.top-card.attempt{background:linear-gradient(135deg,#ea580c,#fb923c);}
.top-card h2{font-weight:800; font-size:20px; margin:2px 0; line-height:1;}
.top-card p{opacity:.9; margin:0; font-size:10px; letter-spacing:.8px; text-transform:uppercase; font-weight:600;}
.top-card small{font-size:11px; opacity:.9;}
.icon-box{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:20px;}
.table-scroll{ max-height:70vh; overflow:auto; border-radius:16px; border:1px solid #e2e8f0; background:#fff; box-shadow:0 8px 20px rgba(0,0,0,.05);}
.table-scroll thead th{ position:sticky; top:0; z-index:3; background:#1e293b; font-size:12px; }
.sticky-name{ position:sticky!important; left:0!important; z-index:5!important; background:#1e293b!important; color:#fff; text-align:left; min-width:140px; }
.sticky-name-body{ position:sticky!important; left:0!important; z-index:2!important; background:#fff!important; color:#174a7e!important; font-weight:700; text-align:left; border-right:1px solid #e2e8f0; }
</style>
</head>
<body>
<nav style="background:#174a7e;padding:12px;position:fixed;top:0;width:100%;z-index:99;"><a href="student-dashboard.html" style="color:#fff;font-weight:700;text-decoration:none;">← Dashboard</a></nav>

<div class="container mt-2">
<div class="row g-2 mb-3">
  <div class="col-6 col-md-3"><div class="card top-card rank p-3 w-100"><div class="d-flex justify-content-between w-100 align-items-center"><div><p>Rank</p><h2 id="myRank">-</h2><small id="myRankTotal">out of -</small></div><div class="icon-box"><i class="bi bi-trophy-fill"></i></div></div></div></div>
  <div class="col-6 col-md-3"><div class="card top-card per p-3 w-100"><div class="d-flex justify-content-between w-100 align-items-center"><div><p>Average %</p><h2 id="myPer">0%</h2><small>Overall Score</small></div><div class="icon-box"><i class="bi bi-graph-up-arrow"></i></div></div></div></div>
  <div class="col-6 col-md-3"><div class="card top-card latest p-3 w-100"><div class="d-flex justify-content-between w-100 align-items-center"><div><p>Latest Test</p><h2 id="myLat">- /20</h2><small id="myLatName">No Test</small></div><div class="icon-box"><i class="bi bi-star-fill"></i></div></div></div></div>
  <div class="col-6 col-md-3"><div class="card top-card attempt p-3 w-100"><div class="d-flex justify-content-between w-100 align-items-center"><div><p>Attempted</p><h2 id="myAttempt">0 / 100</h2><small id="myAttemptPer">0% Completed</small></div><div class="icon-box"><i class="bi bi-check2-square"></i></div></div></div></div>
</div>

<div class="card p-2" style="border-radius:16px; border:0;">
<div class="d-flex justify-content-between p-2"><h6 class="fw-bold mb-0">📝 My Tests - <span id="className"></span></h6></div>
<div class="table-responsive table-scroll"><table class="table table-bordered align-middle text-center mb-0"><thead class="table-dark"><tr id="h2"></tr></thead><tbody id="b2"></tbody></table></div>
</div>
</div>

<script src="../../config.js"></script>
<script>
// आपका Backend Function Same है - कोई Change नहीं
let user = JSON.parse(localStorage.getItem("currentUser") || localStorage.getItem("pal_current_user") || '{"name":"Test","class":"Class 10th","id":"1"}');
function normalizeTestRecords(raw = {}) {
  const normalized = {};
  Object.entries(raw || {}).forEach(([key, value]) => {
    const label = String(key || '').trim();
    let numKey = Number(label);
    if (Number.isNaN(numKey) && /^T\d+$/i.test(label)) numKey = Number(label.replace(/^T/i, ''));
    const cleanValue = Number(value);
    if (!Number.isNaN(numKey) && !Number.isNaN(cleanValue)) normalized[numKey] = cleanValue;
  });
  return normalized;
}
async function loadStudentTestRecords() {
  const studentId = user && user.id ? Number(user.id) : null;
  const savedRecords = JSON.parse(localStorage.getItem('pal_student_test_records') || '{}');
  if (studentId) {
    try {
      const response = await fetch(`${CONFIG.BASE_URL}/students/${studentId}/test-records`);
      const data = await response.json();
      if (response.ok && data.status && data.res && typeof data.res === 'object') {
        localStorage.setItem('pal_student_test_records', JSON.stringify(data.res));
        return data.res;
      }
    } catch (error) { console.warn('Backend fetch failed:', error); }
  }
  return savedRecords;
}
async function renderAll(){
  let records = await loadStudentTestRecords();
  let TM = normalizeTestRecords(records);
  let TC = Math.max(1, ...Object.keys(TM).map(Number), 1);
  document.getElementById('className').innerText=user.class||'';
  let perTotal=0,count=0,lat='-',latName='No Test';
  Object.entries(TM).forEach(([k,v])=>{ if(v!=='' && v!=null && !isNaN(v)){ perTotal+=Number(v); count++; lat=v; latName='T'+k; }});
  const avg = count ? (perTotal/(count*20))*100 : 0;
  document.getElementById('myPer').innerText=avg.toFixed(1)+'%';
  document.getElementById('myLat').innerText=lat!='-'?lat+'/20':'-/20';
  document.getElementById('myLatName').innerText=latName;
  document.getElementById('myAttempt').innerText=count+' / '+TC;
  document.getElementById('myAttemptPer').innerText=(TC? (count/TC*100).toFixed(0):0)+'% Completed';
  document.getElementById('myRank').innerText='1';
  document.getElementById('myRankTotal').innerText='out of 1';
  let h='<th class="sticky-name">Name</th>';
  for(let i=1;i<=TC;i++) h+=`<th style="min-width:60px;">T${i}</th>`;
  document.getElementById('h2').innerHTML=h;
  let html=`<tr><td class="sticky-name-body">${user.name || 'Student'}</td>`;
  for(let k=1;k<=TC;k++){ html+=`<td>${TM[k]!=null && TM[k]!==''?'<b>'+TM[k]+'</b>':'<span style="color:#ccc;">-</span>'}</td>`; }
  html+='</tr>';
  document.getElementById('b2').innerHTML=html;
}
renderAll();
</script>
</body></html>
