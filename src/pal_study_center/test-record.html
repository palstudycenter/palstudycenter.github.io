<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Records</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{padding-top:70px;background:#f4f7ff;font-family:Poppins;}
.top-card{border-radius:18px; border:0; box-shadow:0 8px 20px rgba(0,0,0,.08); height:130px; display:flex; align-items:center;}
.rank-card,.per-card,.latest-card,.attempt-card{background: linear-gradient(135deg,#174a7e 0%,#1e6fa5 100%); color:#fff;}
.top-card h2{font-weight:800; font-size:25px; margin:4px 0;}
.top-card p{opacity:.9; margin:0; font-size:11px; letter-spacing:1px; text-transform:uppercase;}
.top-card small{font-size:12px; opacity:.9;}
.icon-box{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:24px;}
.table-scroll{ max-height:85vh; overflow:auto; border-radius:12px; border:1px solid #ddd; }
.table-scroll thead th{ position:sticky; top:0; z-index:3; background:#212529; }
.sticky-name{ position:sticky!important; top:0!important; left:0!important; z-index:5!important; background:#212529!important; color:#fff; text-align:left; border-right:2px solid #000; min-width:160px; }
.sticky-name-body{ 
  position:sticky!important; 
  left:0!important; 
  z-index:2!important; 
  background: linear-gradient(135deg,#174a7e 0%,#1e6fa5 100%)!important;

  font-weight:700; 
  text-align:left; 
  border-right:2px solid #000; 
}

</style>
</head>
<body>
<nav style="background:#174a7e;padding:12px;position:fixed;top:0;width:100%;z-index:99;"><a href="student-dashboard.html" style="color:#fff;font-weight:700;text-decoration:none;">← Dashboard</a></nav>

<div class="container mt-2">
<div class="row g-3 mb-3">
  <div class="col-6"><div class="card top-card rank-card p-3 w-100"><div class="d-flex justify-content-between w-100 align-items-center"><div><p>Rank</p><h2 id="myRank">-</h2><small id="myRankTotal">out of -</small></div><div class="icon-box"><i class="bi bi-trophy-fill"></i></div></div></div></div>
  <div class="col-6"><div class="card top-card per-card p-3 w-100"><div class="d-flex justify-content-between w-100 align-items-center"><div><p>Average %</p><h2 id="myPer">0%</h2><small>Overall Score</small></div><div class="icon-box"><i class="bi bi-graph-up-arrow"></i></div></div></div></div>
  <div class="col-6"><div class="card top-card latest-card p-3 w-100"><div class="d-flex justify-content-between w-100 align-items-center"><div><p>Latest Test</p><h2 id="myLat">- /20</h2><small id="myLatName">No Test</small></div><div class="icon-box"><i class="bi bi-star-fill"></i></div></div></div></div>
  <div class="col-6"><div class="card top-card attempt-card p-3 w-100"><div class="d-flex justify-content-between w-100 align-items-center"><div><p>Attempted</p><h2 id="myAttempt">0 / 100</h2><small id="myAttemptPer">0% Completed</small></div><div class="icon-box"><i class="bi bi-check2-square"></i></div></div></div></div>
</div>

<div class="card p-2" style="border-radius:16px; border:0; box-shadow:0 8px 20px rgba(0,0,0,.07);">
<div class="d-flex justify-content-between p-2"><h6 class="fw-bold mb-0">📝 My Tests - <span id="className"></span></h6></div>
<div class="table-responsive table-scroll"><table class="table table-bordered align-middle text-center mb-0"><thead class="table-dark"><tr id="h2"></tr></thead><tbody id="b2"></tbody></table></div>
</div>
</div>

<script src="../../config.js"></script>
<script>
let user = JSON.parse(localStorage.getItem("currentUser") || localStorage.getItem("pal_current_user") || '{"name":"Test","class":"Class 10th","id":"1"}');

function normalizeTestRecords(raw = {}) {
  const normalized = {};
  Object.entries(raw || {}).forEach(([key, value]) => {
    const label = String(key || '').trim();
    let numKey = Number(label);
    if (Number.isNaN(numKey) && /^T\d+$/i.test(label)) {
      numKey = Number(label.replace(/^T/i, ''));
    }
    const cleanValue = Number(value);
    if (!Number.isNaN(numKey) && !Number.isNaN(cleanValue)) {
      normalized[numKey] = cleanValue;
    }
  });
  return normalized;
}

async function loadStudentTestRecords() {
  const studentId = user && user.id ? Number(user.id) : null;
  const savedRecords = JSON.parse(localStorage.getItem('pal_student_test_records') || '{}');

  if (studentId) {
    try {
      const response = await fetch(`${CONFIG.BASE_URL}/students/${studentId}/test-records`);
      const data = await response.json();
      if (response.ok && data.status && data.res && typeof data.res === 'object') {
        localStorage.setItem('pal_student_test_records', JSON.stringify(data.res));
        return data.res;
      }
    } catch (error) {
      console.warn('Unable to fetch student test records from backend:', error);
    }
  }

  document.getElementById('className').innerText=user.class||'';
  document.getElementById('myRank').innerText=(myIdx+1);
  document.getElementById('myRankTotal').innerText='out of '+fullList.length;
  document.getElementById('myPer').innerText=myData.per.toFixed(1)+'%';

  let tot=0,c=0,lat='-',ln='';
  for(let k=1;k<=TC;k++){ let v=myData.m[k]; if(v!=='' && v!=null &&!isNaN(v)){tot+=parseInt(v);c++;lat=v;ln='T'+k;} }
  document.getElementById('myLat').innerText=lat!='-'?lat+'/20':'-/20';
  document.getElementById('myLatName').innerText=ln||'No Test';

  // --- 4th Card Fix ---
  document.getElementById('myAttempt').innerText = c + ' / ' + TC;
  let percentCompleted = TC > 0? (c / TC * 100) : 0;
  document.getElementById('myAttemptPer').innerText = percentCompleted.toFixed(1) + '% Completed';
  return savedRecords;
}

async function renderAll(){
  let records = await loadStudentTestRecords();
  let TM = normalizeTestRecords(records);
  let TC = Math.max(1, ...Object.keys(TM).map(Number), 1);

  let myName = (user.name || '').trim().toLowerCase();
  let myId = String(user.id || '').trim().toLowerCase();
  let myData = { name: user.name || 'Student', m: TM };

  document.getElementById('className').innerText = user.class || '';
  document.getElementById('myRank').innerText = '1';
  document.getElementById('myRankTotal').innerText = 'out of 1';

  let perTotal = 0, count = 0, lat = '-', latName = 'No Test';
  Object.entries(TM).forEach(([key, value]) => {
    const num = Number(key);
    if (!Number.isNaN(num) && value !== '' && value != null && !isNaN(value)) {
      perTotal += Number(value);
      count++;
      lat = Number(value);
      latName = `T${num}`;
    }
  });

  const averagePercent = count ? (perTotal / (count * 20)) * 100 : 0;
  document.getElementById('myPer').innerText = averagePercent.toFixed(1) + '%';
  document.getElementById('myLat').innerText = lat !== '-' ? lat + '/20' : '-/20';
  document.getElementById('myLatName').innerText = latName;
  document.getElementById('myAttempt').innerText = count + ' / ' + TC;
  document.getElementById('myAttemptPer').innerText = count ? ((count / TC) * 100).toFixed(0) + '% Completed' : '0% Completed';

  let h = '<th class="sticky-name">Name</th>';
  for (let i = 1; i <= TC; i++) h += `<th style="min-width:60px;">T${i}</th>`;
  document.getElementById('h2').innerHTML = h;

  let html = `<tr><td class="sticky-name-body">${myData.name}</td>`;
  for (let k = 1; k <= TC; k++) {
    const value = TM[k];
    html += `<td>${value != null && value !== '' && !isNaN(value) ? '<b>' + value + '</b>' : '<span style="color:#ccc;">-</span>'}</td>`;
  }
  html += '</tr>';
  document.getElementById('b2').innerHTML = html;
}

renderAll();
window.addEventListener('pageshow', renderAll);
</script>
</body></html>
