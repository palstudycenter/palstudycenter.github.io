<!DOCTYPE html>

<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>


    <!-- =================================================
         BOOTSTRAP
    ================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- =================================================
         BOOTSTRAP ICONS
    ================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


    <!-- =================================================
         CUSTOM CSS
    ================================================== -->

    <link
        href="student-dashboard.css"
        rel="stylesheet">

</head>


<body>


<!-- =====================================================
     NAVBAR
====================================================== -->

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">

    <div class="container">


        <!-- BRAND -->

        <a
            class="navbar-brand"
            href="#">

            <span>पाल</span>

            <span>स्टडी सेंटर</span>

        </a>


        <!-- MOBILE TOGGLE -->

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#nav"
            aria-controls="nav"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>


        <!-- NAVIGATION -->

        <div
            class="collapse navbar-collapse"
            id="nav">

            <ul class="navbar-nav ms-auto">


                <!-- TEST RECORD -->

                <li
                    class="nav-item"
                    id="navTestRecord">

                   <a class="nav-link" href="test-record.html">
                    <i class="bi bi-clipboard-data"></i>
                     Test Record
                   </a>
                  

                </li>


                <!-- FEES RECORD -->

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="#"
                        onclick="openFeesModal(event)">

                        Fees Record

                    </a>

                </li>


            </ul>

        </div>

    </div>

</nav>



<!-- =====================================================
     HERO
====================================================== -->

<section class="hero">


    <div class="hero-content">


        <!-- DASHBOARD TITLE -->

        <h1 class="dashboard-title">

            Dashboard

        </h1>


        <!-- STUDENT NAME
             JS द्वारा automatically आएगा
        -->

        <h3 id="studentName"></h3>

        <!-- MARQUEE -->

        <div class="hero-marquee">

            <span id="marqueeText">

                📢 Your Dashboard is active |
                📚 All academic modules are enabled |
                🎓 Wishing you a productive learning experience

            </span>

        </div>


    </div>

</section>



<!-- =====================================================
     NOTICE BOARD
====================================================== -->

<section class="container py-4">


    <div class="notice-wrapper">


        <!-- NOTICE HEADER -->

        <div class="notice-header">

            <div>

                <span class="notice-label">

                    <i class="bi bi-megaphone-fill"></i>

                    NOTICE BOARD

                </span>

            </div>

        </div>


        <!-- NOTICE DATA
             JS द्वारा load होगा
        -->

        <div
            id="noticeContainer"
            class="notice-grid">


            <!-- LOADING -->

            <div class="notice-card notice-loading">

                <div
                    class="spinner-border text-primary"
                    role="status">
                </div>

                <span>

                    Loading notices...

                </span>

            </div>


        </div>


    </div>


</section>



<!-- =====================================================
     MY SUBJECTS
====================================================== -->

<section class="container pb-5">


    <div
        class="subjects-wrapper"
        id="mySubjects">


        <!-- SUBJECT HEADER -->

        <div class="notice-header">


            <!-- MY SUBJECTS -->

            <span class="subjects-section-label">

                <i class="bi bi-mortarboard-fill"></i>

                My Subjects

            </span>


            <!-- STUDENT INFO -->

            <p id="studentInfo"></p>


        </div>


        <!-- SUBJECT CARDS
             JS द्वारा automatically आएंगे
        -->

        <div
            id="subjectsContainer"
            class="subjects-grid">
        </div>


    </div>


</section>



<!-- =====================================================
     SUBJECT UNITS MODAL
====================================================== -->

<div
    class="modal fade"
    id="unitsModal"
    tabindex="-1"
    aria-hidden="true">


    <div
        class="modal-dialog modal-lg modal-dialog-centered">


        <div class="modal-content">


            <!-- HEADER -->

            <div class="modal-header">


                <h5 class="modal-title">


                    <i class="bi bi-book-fill"></i>


                    <span id="unitsSubjectName"></span>


                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>


            </div>


            <!-- BODY -->

            <div class="modal-body">


                <div
                    id="unitsContent"
                    style="
                        max-height:500px;
                        overflow-y:auto;
                    ">


                    <div class="text-center text-muted">


                        <div
                            class="spinner-border"
                            role="status">
                        </div>


                        <p class="mt-2">

                            Loading units...

                        </p>


                    </div>


                </div>


            </div>


            <!-- FOOTER -->

            <div class="modal-footer">


                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Close

                </button>


            </div>


        </div>


    </div>


</div>



<!-- =====================================================
     FEES RECORD MODAL
====================================================== -->

<div
    class="modal fade"
    id="feesModal"
    tabindex="-1"
    aria-hidden="true">


    <div
        class="modal-dialog modal-lg modal-dialog-centered">


        <div class="modal-content">


            <!-- HEADER -->

            <div class="modal-header">


                <h5 class="modal-title">


                    <i class="bi bi-currency-rupee"></i>

                    Monthly Fee Record


                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close">
                </button>


            </div>


            <!-- BODY -->

            <div class="modal-body">


                <div
                    id="feesContent"
                    style="
                        max-height:500px;
                        overflow-y:auto;
                    ">


                    <div class="text-center text-muted">


                        <div
                            class="spinner-border"
                            role="status">
                        </div>


                        <p class="mt-2">

                            Loading fees...

                        </p>


                    </div>


                </div>


            </div>


            <!-- FOOTER -->

            <div class="modal-footer">


                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Close

                </button>


            </div>


        </div>


    </div>


</div>



<!-- =====================================================
     JAVASCRIPT FILES
====================================================== -->

<script src="../../config.js"></script>

<script src="pal-study-data.js"></script>

<script src="student-dashboard.js"></script>


<!-- BOOTSTRAP JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
