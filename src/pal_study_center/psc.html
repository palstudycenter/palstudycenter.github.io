<script>  
let khatas=JSON.parse(localStorage.getItem('khata_final_v7')||'[]');
let vouchers=JSON.parse(localStorage.getItem('voucher_final_v7')||'[]');
if(khatas.length==0){
khatas=[
{id:1,type:'नकद',name:'नकद हाथ में',op:0,side:'jama'},
{id:2,type:'बैंक',name:'SBI बैंक',op:0,side:'jama'},
{id:3,type:'आय',name:'कोचिंग क्लासेस',op:0,side:'jama'},
{id:4,type:'आय',name:'ब्याज',op:0,side:'jama'},
{id:5,type:'आय',name:'किराया',op:0,side:'jama'},
{id:6,type:'व्यय',name:'घर खर्च',op:0,side:'jama'},
{id:7,type:'व्यय',name:'फंक्शन - हलवाई',op:0,side:'jama'},
{id:8,type:'व्यय',name:'रेनोवेशन - पेंटर',op:0,side:'jama'},
{id:9,type:'उधारी दी',name:'रमेश उधारी',op:0,side:'jama'},
{id:10,type:'लोन',name:'सोलर लोन',op:17000,side:'dena'}
];
}
let currentFilter='नकद';
function save(){localStorage.setItem('khata_final_v7',JSON.stringify(khatas));localStorage.setItem('voucher_final_v7',JSON.stringify(vouchers));}
function getBal(id){
 let k=khatas.find(x=>x.id==id);
 if(!k) return {jama:0,gaya:0,shesh:0,display:0};
 let initial = k.side=='jama' ? (+k.op||0) : -(+k.op||0);
 let jama=0,gaya=0;
 vouchers.forEach(v=>{
  if(String(v.to)==String(id)) jama+= +v.amt;
  if(String(v.from)==String(id)) gaya+= +v.amt;
 });
 let shesh = initial + jama - gaya;
 let display = shesh;
 if(k.type=='आय') display = -shesh;
 if(['लोन','उधारी ली','परिवार'].includes(k.type)) display = Math.abs(shesh);
 return {jama,gaya,shesh,display,name:k.name,type:k.type};
}
  
function showTab(t){

  ['home','khata','voucher','create','balance','prabandhan-frame','studentControl','english'].forEach(x=>{
   let el=document.getElementById('tab-'+x); if(el) el.style.display='none';
 });
 document.getElementById('ledgerSubSec').style.display='none';
 document.querySelectorAll('.header .action-btn').forEach(b=>b.classList.remove('active'));
 
 if(t=='home'){document.getElementById('tab-home').style.display='block';document.getElementById('bH').classList.add('active');}

function deleteKhata(id){
 let related = vouchers.filter(v=>String(v.from)==String(id) || String(v.to)==String(id));
 if(related.length > 0){
   if(!confirm(`इस खाते में ${related.length} लेन-देन जुड़े हैं।\nक्या खाता + सारी Entry दोनों हटानी हैं?`)) return;
   vouchers = vouchers.filter(v=>String(v.from)!=String(id) && String(v.to)!=String(id));
 }
 if(!confirm('खाता पक्का हटाना है?')) return;
 khatas = khatas.filter(k=>String(k.id)!=String(id));
 save(); renderAll(); renderVoucher();
 if(document.getElementById('detailBox').style.display=='block') backToList();
}

function onNatureChange(){
  const nat = document.getElementById('vNature').value;
  const cashBank = khatas.filter(k=>['नकद','बैंक'].includes(k.type));
  let fromList=[], toList=[], nar='';
  if(nat=='contra'){ fromList=cashBank; toList=cashBank; nar='नकद जमा/निकासी'; }
  if(nat=='receipt'){ fromList=khatas.filter(k=>['आय','उधारी दी','उधारी ली','परिवार','लोन'].includes(k.type)); toList=cashBank; nar='रुपया आया'; }
  if(nat=='payment'){ fromList=cashBank; toList=khatas.filter(k=>['व्यय','उधारी दी','उधारी ली','परिवार','लोन','एसेट'].includes(k.type)); nar='रुपया गया / खर्च'; }
  if(nat=='journal'){ fromList=khatas.filter(k=>!['नकद','बैंक'].includes(k.type)); toList=khatas.filter(k=>!['नकद','बैंक'].includes(k.type)); nar='हिसाब समायोजन'; }
  if(nat=='purchase'){ fromList=cashBank; toList=khatas.filter(k=>k.type=='एसेट'); nar='एसेट खरीदा'; }
  if(nat=='sales'){ fromList=khatas.filter(k=>k.type=='एसेट'); toList=cashBank; nar='एसेट बेचा'; }
  if(nat==''){ 
    document.getElementById('vFrom').innerHTML='<option value="">-- पहले प्रकार चुनें --</option>';
    document.getElementById('vTo').innerHTML='<option value="">-- पहले प्रकार चुनें --</option>';
    document.getElementById('vNar').value=''; return;
  }
  document.getElementById('vFrom').innerHTML = fromList.map(k=>`<option value="${k.id}">${k.name} [${k.type}]</option>`).join('') || '<option value="">खाता नहीं</option>';
  document.getElementById('vTo').innerHTML = toList.map(k=>`<option value="${k.id}">${k.name} [${k.type}]</option>`).join('') || '<option value="">खाता नहीं</option>';
  document.getElementById('vNar').value = nar;
}

function getHinduDataObj(dateObj){
  let d=String(dateObj.getDate()).padStart(2,'0');
  let m=String(dateObj.getMonth()+1).padStart(2,'0');
  let y=dateObj.getFullYear();
  let iso=`${d}-${m}-${y}`;
  return {dateStr:iso,tithi:REAL_TITHI[iso]||"तिथि",festival:HINDU_FESTIVALS[iso]?.festival||"",holiday:HINDU_FESTIVALS[iso]?.holiday||false};
}
  
function initCal(){
  let sel=document.getElementById('calMonth');sel.innerHTML="";
  let start=new Date(2026,9,1),end=new Date(2027,10,31),c=new Date(start);
  while(c<=end){
    let y=c.getFullYear(),m=c.getMonth();
    let d=new Date(y,m,1);
    sel.innerHTML+=`<option value="${y}-${m}" ${y==2026&&m==9?'selected':''}>${d.toLocaleString('hi-IN',{month:'long',year:'numeric'})}</option>`;
    c.setMonth(c.getMonth()+1);
  }
  renderCalendar();
  if(document.getElementById('intFrom')) document.getElementById('intFrom').valueAsDate=new Date();
  if(document.getElementById('intTo')) document.getElementById('intTo').valueAsDate=new Date(new Date().setMonth(new Date().getMonth()+1));
  }  
  
function renderCalendar(){
  let val=document.getElementById('calMonth').value;
  let [y,m]=val.split('-').map(Number);
  let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),body=document.getElementById('calBody');
  body.innerHTML='';for(let i=0;i<first;i++) body.innerHTML+=`<div></div>`;
  let today=new Date();
  let todayStr=`${String(today.getDate()).padStart(2,'0')}-${String(today.getMonth()+1).padStart(2,'0')}-${today.getFullYear()}`;
  for(let d=1;d<=days;d++){let dateObj=new Date(y,m,d);let iso=`${String(d).padStart(2,'0')}-${String(m+1).padStart(2,'0')}-${y}`;let h=getHinduDataObj(dateObj);let isFest=h.festival!="";let isToday=iso==todayStr;body.innerHTML+=`<div class="cal-day ${isFest?'fest-day':''} ${isToday?'today':''}" onclick="showDayDetail('${iso}')" style="${isFest?'border:2px solid #e11d48;background:#fff1f2':''}"><b>${d}</b><div style="font-size:8px;color:#64748b">${h.tithi.split(' ')[1]}</div>${isFest?`<div style="font-size:7px;color:#e11d48;font-weight:700">${h.festival.substring(0,11)}</div>`:''}</div>`;}
}
  
function showDayDetail(iso){
  let p=iso.split('-');
  let dateObj=new Date(p[2],p[1]-1,p[0]);
  let h=getHinduDataObj(dateObj);
  let info=document.getElementById('calSelectedInfo');
  if(!info) return;
  info.style.display='block';
  info.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#174a7e;font-size:14px">📅 ${dateObj.toLocaleDateString('hi-IN',{weekday:'long', day:'numeric', month:'long'})}</b><span onclick="document.getElementById('calSelectedInfo').style.display='none'" style="cursor:pointer;background:#174a7e;color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px">✕</span></div><div class="mt-2 p-2 rounded" style="background:#f0f7ff;font-size:13px"><b>तिथि:</b> ${h.tithi}<br><b>वार:</b> ${dateObj.toLocaleDateString('hi-IN',{weekday:'long'})}</div>${h.festival?`<div class="mt-2 p-2 rounded text-center" style="background:#fff1f2;border:1.5px dashed #e11d48;color:#e11d48;font-weight:800;font-size:13px">🎉 ${h.festival}<br><small style="font-size:11px">${h.holiday?'PSC छुट्टी':''}</small></div>`:`<div class="mt-2 small text-center text-muted">कोई विशेष त्यौहार नहीं</div>`}`;
}
initCal();renderAll();onCTypeChange();

window.addEventListener('message', function(event){
  if(event.data && event.data.type === 'COACHING_FEE_ADDED'){
    let fee = parseFloat(event.data.amount);
    let studentName = event.data.name;
    let className = event.data.className || '';
    let toId = event.data.toId || "1";
    let newVoucher = {
      id: Date.now(),
      date: new Date().toISOString().split('T')[0],
      amt: fee,
      from: "3",
      to: toId,
      nar: studentName + ' - ' + className,
      vType: 'receipt'
    };
    vouchers.push(newVoucher);
    save();
    renderAll();
  }
});
