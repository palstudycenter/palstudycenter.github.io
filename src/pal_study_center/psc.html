let khatas=JSON.parse(localStorage.getItem('khata_final_v7')||'[]');let vouchers=JSON.parse(localStorage.getItem('voucher_final_v7')||'[]');
if(khatas.length==0){khatas=[{id:1,no:'C001',type:'नकद',name:'नकद हाथ में',op:500,side:'jama'},{id:2,no:'B001',type:'बैंक',name:'बैंक',op:1000,side:'jama'},{id:3,type:'आय',name:'कोचिंग क्लासेस',op:0,side:'jama',no:'I001'},{id:4,type:'आय',name:'ब्याज',op:0,side:'jama',no:'I002'},{id:5,type:'व्यय',name:'घरेलू खर्च',op:0,side:'jama',no:'E001'},{id:101,type:'फंक्शन व्यय',name:'हलवाई',op:0,side:'jama',no:'F001'},{id:201,type:'घरेलू रेनोवेशन व्यय',name:'पेंटर',op:0,side:'jama',no:'R001'},{id:12,type:'लोन',name:'सोलर लोन',op:50000,side:'dena',no:'L001'}];}

function save(){localStorage.setItem('khata_final_v7',JSON.stringify(khatas));localStorage.setItem('voucher_final_v7',JSON.stringify(vouchers));localStorage.setItem('palGuests_BC_Original',JSON.stringify(guests));localStorage.setItem('nautaniyaGuests',JSON.stringify(nautaniyaGuests));localStorage.setItem('wedVendors',JSON.stringify(vendors));localStorage.setItem('wedMembers',JSON.stringify(members));localStorage.setItem('devList',JSON.stringify(devs));localStorage.setItem('palMenus',JSON.stringify(menus));localStorage.setItem('palMenuInfo',JSON.stringify(menuInfo));}

  
  function showTab(t){
  ['home','khata','voucher','create','vendor','family','dev','guest','nautaniya','student' ].forEach(x=>{let el=document.getElementById('tab-'+x); if(el) el.style.display='none'});
// menu is inside guest tab, handle separately
if(t!='menu'){
 let el=document.getElementById('tab-'+t);
 if(el) el.style.display='block';
}
document.querySelectorAll('.action-btn').forEach(b=>b.classList.remove('active'));
let map={home:'bH',khata:'bK',voucher:'bV',create:'bC',vendor:'bVendor',family:'bFamily',dev:'bDev',guest:'bGuest',nautaniya:'bNau'};
if(map[t] && document.getElementById(map[t])) document.getElementById(map[t]).classList.add('active');
if(t=='home')renderHome();
if(t=='khata'){document.getElementById('filterWrap').style.display='block';document.getElementById('listWrap').style.display='block';document.getElementById('detailBox').style.display='none';renderAll();}
if(t=='voucher'){renderVoucher();onNatureChange();}
if(t=='vendor')renderVendors();
if(t=='family')renderFamily();

if(t=='nautaniya'){document.getElementById('nauListWrap').style.display='block';document.getElementById('nauDetailBox').style.display='none';renderGuestCats('nautaniya');renderGuestCards();}
}
function getBal(id){let k=khatas.find(x=>x.id==id);let jama=k.side=='jama'?k.op:0,gaya=k.side=='dena'?k.op:0;vouchers.forEach(v=>{if(v.to==id)jama+= +v.amt;if(v.from==id)gaya+= +v.amt;});return{jama,gaya,shesh:jama-gaya};}

  function filterKhata(el,f){
 currentFilter=f;
 // सभी को पहले नीला करो
 document.querySelectorAll('#filterBar .filter-btn').forEach(b=>b.classList.remove('active'));
 // सिर्फ क्लिक वाले को सफेद
 if(el) el.classList.add('active');
 renderAll();
  }
  
function renderAll(){let list=khatas.filter(k=>k.type==currentFilter);let html=list.map(k=>{let b=getBal(k.id);return `<div class="khata-btn d-flex justify-content-between align-items-center"><div onclick="openDetail(${k.id})" style="flex:1"><div class="d-flex justify-content-between"><b style="color:#174a7e">${k.name}</b><span class="badge" style="background:#174a7e">₹${b.shesh}</span></div><small>${k.type}</small></div><button onclick="deleteKhata(${k.id})" style="background:#fee2e2;border:none;border-radius:50%;width:32px;height:32px">🗑️</button></div>`}).join('')||'<small>कोई नहीं</small>';document.getElementById('allList').innerHTML=`<h6 style="color:#174a7e">${currentFilter} (${list.length})</h6>`+html;renderHome();}
function deleteKhata(id){ if(!confirm('ये खाता हटाना है?')) return; let hasTrans = vouchers.some(v=>v.from==id || v.to==id); if(hasTrans){ alert('इसमें लेन-देन है'); return; } khatas = khatas.filter(x=>x.id!=id); save(); renderAll(); }
function openDetail(id){document.getElementById('filterWrap').style.display='none';document.getElementById('listWrap').style.display='none';document.getElementById('detailBox').style.display='block';let k=khatas.find(x=>x.id==id);let b=getBal(id);let trans=vouchers.filter(v=>v.from==id||v.to==id).sort((a,b)=>new Date(a.date)-new Date(b.date));let jamaList=trans.filter(v=>v.to==id),gayaList=trans.filter(v=>v.from==id);document.getElementById('detailBox').innerHTML=`<div class="ledger-white-card"><div class="ledger-top"><button onclick="backToList()" class="btn btn-sm text-white me-2" style="background:#174a7e">⬅️ वापस</button>${k.name} ₹${b.shesh}</div><div class="ledger-scroll"><div class="ledger-main"><div class="ledger-col left"><div class="col-title jama">✅ आया</div><div class="header-row"><div>राशि</div><div>दिनांक</div><div>विवरण</div></div>${jamaList.map(v=>{let o=khatas.find(x=>x.id==v.from)?.name||'?';return `<div class="entry-grid"><div>₹${v.amt}</div><div>${v.date}</div><div>${o} → ${k.name} ${v.nar||''}</div></div>`}).join('')||'<div class="p-2 small">कोई नहीं</div>'}</div><div class="ledger-col"><div class="col-title gaya">❌ गया</div><div class="header-row"><div>राशि</div><div>दिनांक</div><div>विवरण</div></div>${gayaList.map(v=>{let o=khatas.find(x=>x.id==v.to)?.name||'?';return `<div class="entry-grid"><div>₹${v.amt}</div><div>${v.date}</div><div>${k.name} → ${o} ${v.nar||''}</div></div>`}).join('')||'<div class="p-2 small">कोई नहीं</div>'}</div></div></div></div>`;}
function backToList(){document.getElementById('filterWrap').style.display='block';document.getElementById('listWrap').style.display='block';document.getElementById('detailBox').style.display='none';}
function onNatureChange(){let nat=document.getElementById('vNature').value;let cash=khatas.filter(k=>k.type=='नकद'),bank=khatas.filter(k=>k.type=='बैंक'),func=khatas.filter(k=>k.type=='फंक्शन व्यय'),reno=khatas.filter(k=>k.type=='घरेलू रेनोवेशन व्यय'),all=khatas;function opt(l){return l.map(k=>`<option value="${k.id}">${k.name}</option>`).join('');}let from=[],to=[];if(nat=='aay'){from=all.filter(k=>k.type=='आय');to=[...cash,...bank];}else if(nat=='kharch'){from=[...cash,...bank];to=all.filter(k=>k.type=='व्यय');}else if(nat=='func_exp'){from=[...cash,...bank];to=func;}else if(nat=='reno_exp'){from=[...cash,...bank];to=reno;}else if(nat=='udhar_diya'){from=[...cash,...bank];to=all.filter(k=>k.type=='उधारी दी');}else if(nat=='udhar_vapas_aaya'){from=all.filter(k=>k.type=='उधारी दी');to=[...cash,...bank];}else if(nat=='udhar_liya'){from=all.filter(k=>k.type=='उधारी ली');to=[...cash,...bank];}else if(nat=='udhar_vapas_diya'){from=[...cash,...bank];to=all.filter(k=>k.type=='उधारी ली');}else if(nat=='asset_kharida'){from=[...cash,...bank];to=all.filter(k=>k.type=='एसेट');}else if(nat=='asset_becha'){from=all.filter(k=>k.type=='एसेट');to=[...cash,...bank];}else if(nat=='bank_to_cash'){from=bank;to=cash;}else if(nat=='cash_to_bank'){from=cash;to=bank;}else if(nat=='family_diya'){from=[...cash,...bank];to=all.filter(k=>k.type=='परिवार');}else if(nat=='family_liya'){from=all.filter(k=>k.type=='परिवार');to=[...cash,...bank];}else if(nat=='loan_emi'){from=bank;to=all.filter(k=>k.type=='लोन');}else{from=all;to=all;}document.getElementById('vFrom').innerHTML=opt(from);document.getElementById('vTo').innerHTML=opt(to);}
function renderVoucher(){document.getElementById('vDate').valueAsDate=new Date();document.getElementById('vHist').innerHTML=vouchers.slice().reverse().slice(0,10).map(v=>{let f=khatas.find(x=>x.id==v.from)?.name||'?',t=khatas.find(x=>x.id==v.to)?.name||'?';return `<div class="card p-2 mb-1 small"><b>₹${v.amt}</b> ${f} → ${t} | ${v.date}</div>`}).join('');}

  function createKhata(){
let k={id:Date.now(),no:'K'+(khatas.length+1),type:document.getElementById('cType').value,name:document.getElementById('cName').value,op:+document.getElementById('cOp').value||0,side:document.getElementById('cSide').value};

khatas.push(k);
save();
showTab('khata');
currentFilter=k.type;
document.querySelectorAll('#filterBar .filter-btn').forEach(b=>b.classList.remove('active'));

let map={'नकद':0,'बैंक':1,'आय':2,'व्यय':3,'उधारी दी':4,'उधारी ली':5,'एसेट':6,'परिवार':7,'लोन':8,'फंक्शन व्यय':9,'घरेलू रेनोवेशन व्यय':10};
if(allBtns[map[k.type]]){ allBtns[map[k.type]].classList.add('active'); }
renderAll();
  }
  
  
  function saveVoucher(){let v={id:Date.now(),date:document.getElementById('vDate').value,amt:+document.getElementById('vAmt').value,from:+document.getElementById('vFrom').value,to:+document.getElementById('vTo').value,nar:document.getElementById('vNar').value};if(!v.amt)return;vouchers.push(v);save();renderVoucher();renderAll();alert('सेव');}
function renderHome(){let cash=khatas.filter(k=>k.type=='नकद').reduce((s,k)=>s+getBal(k.id).shesh,0);let bank=khatas.filter(k=>k.type=='बैंक').reduce((s,k)=>s+getBal(k.id).shesh,0);let loan=khatas.filter(k=>k.type=='लोन').reduce((s,k)=>s+getBal(k.id).shesh,0);document.getElementById('hCash').innerText=cash;document.getElementById('hBank').innerText=bank;document.getElementById('hLoan').innerText=Math.abs(loan);}

function calcInt(){let from=new Date(document.getElementById('intFrom').value);let to=new Date(document.getElementById('intTo').value);let p=+document.getElementById('intP').value||0;let r=+document.getElementById('intR').value||0;if(!from||!to||to<=from){document.getElementById('intRes').innerText='तारीख सही चुनें';return;}let diff=Math.ceil((to-from)/(1000*60*60*24));let years=diff/365;let si=p*r/100*years;document.getElementById('intRes').innerHTML=`दिन: ${diff} | ब्याज: ₹${si.toFixed(0)} | कुल: ₹${(p+si).toFixed(0)}`;}

 document.getElementById('menuDetailBox').innerHTML=`<div class="ledger-white-card"><div class="ledger-top"><div class="d-flex justify-content-between align-items-center"><div class="d-flex align-items-center gap-2"><button onclick="openBhojanProgList()" class="btn btn-sm" style="background:#fff;color:#174a7e!important;border-radius:20px;font-weight:800">⬅️ वापस</button><b>🎉 ${prog}</b></div><span style="background:#fff;color:#174a7e;border-radius:12px;padding:4px 10px;font-size:11px;font-weight:800">📅 ${info.date||'-'} ⏰ ${info.time||'-'}</span></div></div><div style="display:flex;min-height:220px"><div style="flex:0 0 50%;border-right:2px solid #174a7e;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;gap:10px"><div style="background:#f0f7ff;border-radius:12px;padding:10px;width:90%;text-align:center;border:1.5px solid #dbeafe"><div style="font-size:11px;color:#174a7e;font-weight:800">📅 दिन</div><div style="font-size:14px;font-weight:900">${info.date||'--'}</div><div style="font-size:11px;color:#174a7e;font-weight:800;margin-top:6px">⏰ समय</div><div style="font-size:14px;font-weight:900">${info.time||'--'}</div></div><div style="background:#ecfdf5;border-radius:12px;padding:10px;width:90%;text-align:center"><div style="font-size:11px;color:#0f766e;font-weight:800">👨‍👩‍👧 परिवार</div><div style="font-size:22px;font-weight:900">${families.length}</div></div><div style="background:#fffbeb;border-radius:12px;padding:10px;width:90%;text-align:center"><div style="font-size:11px;color:#b45309;font-weight:800">👥 लोग</div><div style="font-size:22px;font-weight:900">${totalPeople}</div></div></div><div style="flex:0 0 50%;background:#fdf6ee;padding:10px"><div class="col-title" style="background:#eff6ff;color:#1e40af;border-radius:8px;margin-bottom:8px">🍛 मेनू - ${menus[prog].length} आइटम</div><div>${menus[prog].map(m=>`<div class="menu-item"><span>🍽️ ${m.name}</span></div>`).join('')||'<small>Excel में Menu शीट में नहीं मिला</small>'}</div></div></div></div>`;
}
function importExcel(){
 let file=document.getElementById('excelFile').files[0]; if(!file)return;
 let reader=new FileReader();
 reader.onload=function(e){
  let wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
  let ng=[], nn=[], nc=[], idc=1;
  let newMenus={}, newMenuInfo={};
  wb.SheetNames.forEach(sh=>{
   let rows=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1});
   if(!rows.length)return;
   if(sh.toLowerCase().trim()=='menu'){
     rows.forEach((r,i)=>{
       if(i==0||!r[0])return;
       let prog=r[0].toString().trim();
       let dish=r[1]?r[1].toString().trim():'';
       let day=r[2]?r[2].toString().trim():'';
       let time=r[3]?r[3].toString().trim():'';
       if(!newMenus[prog]) newMenus[prog]=[];
       if(dish) newMenus[prog].push({name:dish});
       if(day||time) newMenuInfo[prog]={date:day,time:time};
     });
     return;
   }
   if(!nc.includes(sh)) nc.push(sh);
   rows.forEach((r,i)=>{
     if(i==0||!r[0])return;
     let name=r[0].toString().trim();
     let obj={id:idc++,cat:sh,name:name,extra:{सरनेम:r[1]||'',स्थान:r[2]||''},phone:r[3]||'',members:parseInt(r[4])||1,events:r[5]?r[5].toString().split(',').map(s=>s.trim()):["शादी"],ayaList:[],diyaList:[]};
     if(sh.toLowerCase().includes('नौतानिया')) nn.push(obj); else ng.push(obj);
   });
  });
  guests=ng; nautaniyaGuests=nn; categories=nc; currentCat=categories[0];
  menus=newMenus; menuInfo=newMenuInfo;
  save();
  alert('Menu Excel से अपडेट हो गया');
  showTab('guest');
 };
 reader.readAsArrayBuffer(file);
}
  

function formatMonth(ym){
 if(!ym) return '';
 let [y,m]=ym.split('-');
 let months=['','जनवरी','फरवरी','मार्च','अप्रैल','मई','जून','जुलाई','अगस्त','सितंबर','अक्टूबर','नवंबर','दिसंबर'];
 return `${months[parseInt(m)]} ${y}`;
}
let students = JSON.parse(localStorage.getItem('palStudents')||'[]');

function saveStudents(){localStorage.setItem('palStudents',JSON.stringify(students));}
function save(){localStorage.setItem('khata_final_v7',JSON.stringify(khatas));localStorage.setItem('voucher_final_v7',JSON.stringify(vouchers));localStorage.setItem('palGuests_BC_Original',JSON.stringify(guests));localStorage.setItem('nautaniyaGuests',JSON.stringify(nautaniyaGuests));localStorage.setItem('wedVendors',JSON.stringify(vendors));localStorage.setItem('wedMembers',JSON.stringify(members));localStorage.setItem('devList',JSON.stringify(devs));localStorage.setItem('palMenus',JSON.stringify(menus));localStorage.setItem('palMenuInfo',JSON.stringify(menuInfo));localStorage.setItem('palStudents',JSON.stringify(students));}
  
function addStudent(){
 let curMonth = new Date().toISOString().slice(0,7);
 let st={
   id:Date.now(),
   name:document.getElementById('sName').value.trim(),
   cls:document.getElementById('sClass').value.trim(),
   fee:document.getElementById('sFee').value||'1500',
   sPhone:document.getElementById('sPhone').value.trim(),
   pPhone:document.getElementById('sParentPhone').value.trim(),
   status:'Unpaid',
   month:curMonth
 };
 if(!st.name) return alert('नाम लिखें');
 students.push(st);
 saveStudents();
 renderStudents();
 document.getElementById('sName').value='';
 document.getElementById('sClass').value='';
 document.getElementById('sFee').value='';
 document.getElementById('sPhone').value='';
 document.getElementById('sParentPhone').value='';
 alert('सेव हो गया');
}

function updateStudent(id, field, value){
 let s=students.find(x=>x.id==id); if(s){s[field]=value; saveStudents(); renderStudents();}
}
function toggleDetail(id){
 let el=document.getElementById('det-'+id);
 el.style.display = el.style.display=='none'? 'block' : 'none';
}
function renderStudents(){
 let fClass = document.getElementById('filterClass')?.value||'';
 let list = fClass? students.filter(s=>s.cls==fClass) : students;
 let groups={};
 list.forEach(s=>{ if(!groups[s.cls]) groups[s.cls]=[]; groups[s.cls].push(s); });
 let html=`<small style="color:#6b7280">कुल ${list.length} स्टूडेंट</small>`;
 for(let cls in groups){
  html+=`<div class="mt-3"><b style="color:#174a7e;border-bottom:2px solid #174a7e">${cls||'बिना क्लास'} (${groups[cls].length})</b></div>`;
  html+=groups[cls].map(s=>{
    let feeMsg = s.status=='Paid'? `नमस्ते अभिभावक, ${s.name} की ${formatMonth(s.month)} की फीस ₹${s.fee} प्राप्त हो गई। - पाल स्टडी सेंटर` : `नमस्ते अभिभावक, ${s.name} की ${formatMonth(s.month)} की फीस ₹${s.fee} बाकी है। - पाल स्टडी सेंटर`;
    return `<div class="card p-2 mb-1">
     
      <div class="d-flex justify-content-between align-items-center">
        <div onclick="toggleDetail(${s.id})" style="cursor:pointer;flex:1"><b>${s.name}</b> <small style="color:${s.status=='Paid'?'green':'#d97706'}"> ${s.status} | ${formatMonth(s.month)}</small></div>
        <button onclick="if(confirm('हटाना है?')){students=students.filter(x=>x.id!=${s.id});saveStudents();renderStudents()}" style="background:#fee2e2;border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center">🗑️</button>
      </div>
      <div id="det-${s.id}" style="display:none">
        <hr style="margin:6px 0">
        <div class="d-flex gap-1 mb-1">
          <input type="month" value="${s.month}" onchange="updateStudent(${s.id},'month',this.value)" class="form-control form-control-sm" style="width:50%">
          <select onchange="updateStudent(${s.id},'status',this.value)" class="form-control form-control-sm" style="width:50%"><option value="Unpaid" ${s.status=='Unpaid'?'selected':''}>Unpaid</option><option value="Paid" ${s.status=='Paid'?'selected':''}>Paid</option></select>
        </div>
        <small>छात्र: ${s.sPhone} | अभिभावक: ${s.pPhone} | फीस: ₹${s.fee} | क्लास: ${s.cls}</small>
        <div class="d-flex gap-1 mt-2">
          <a href="https://wa.me/91${s.pPhone}?text=${encodeURIComponent(feeMsg)}" target="_blank" class="btn btn-sm" style="border:1px solid #174a7e;color:#174a7e;flex:1;font-size:11px">फीस</a>
        </div>
        <button onclick="if(confirm('हटाना है?')){students=students.filter(x=>x.id!=${s.id});saveStudents();renderStudents()}" class="btn btn-sm w-100 mt-2" style="color:#ccc;font-size:10px">हटाएं</button>
      </div>
    </div>`;
  }).join('');
 }
 document.getElementById('studentList').innerHTML=html||'<small>कोई स्टूडेंट नहीं</small>';
}
setTimeout(renderStudents,500);
initCal();
renderHome();
        
</script>
