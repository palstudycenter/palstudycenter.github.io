<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:#fdf6ee;font-family:Poppins,sans-serif}
.card{border-radius:12px;border:none;box-shadow:0 6px 18px rgba(0,0,0,.06)}
.filter-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.action-btn{background:#f1f5f9!important;color:#174a7e!important;border:1.5px solid #dbeafe!important;border-radius:20px!important;font-weight:800!important;padding:3px 10px!important;font-size:10px}
.filter-btn{background:linear-gradient(135deg,#174a7e 0%,#1e6fa5 100%)!important;color:#fff!important;border:none!important;border-radius:9px!important;font-weight:700!important;min-height:36px!important;display:flex!important;align-items:center!important;justify-content:center!important;font-size:9px!important}
.ledger-white-card{background:#fff;border-radius:16px;border:1.5px solid #174a7e;overflow:hidden}
.ledger-top{background:#f0f7ff;padding:6px 10px;border-bottom:1.5px solid #dbeafe;font-weight:700;color:#174a7e;font-size:11px;border-top:1.5px solid #dbeafe}
.ledger-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ledger-main{display:flex;min-width:720px}
.ledger-col{flex:1;min-width:350px}
.ledger-col.left{border-right:2px solid #174a7e}
.col-title{text-align:center;padding:5px;font-weight:800;font-size:9px}
.col-title.jama{background:#ecfdf5;color:#0f766e}
.col-title.gaya{background:#fffbeb;color:#b45309}
.header-row{display:grid;grid-template-columns:80px 90px 60px;background:#f0f7ff;font-size:8px;font-weight:800;border-bottom:1px solid #dbeafe}
.header-row div{padding:4px;border-right:1px solid #e6eef7;text-align:center;display:flex;align-items:center;justify-content:center}
.entry-grid{display:grid;grid-template-columns:80px 90px 60px;border-bottom:1px dashed #e5e7eb;font-size:10px}
.entry-grid div{padding:5px;border-right:1px solid #f3f4f6;min-height:30px;display:flex;align-items:center;justify-content:center}
.entry-grid div:nth-child(2){color:#174a7e;background:#f0f7ff}
.entry-grid div:first-child{color:#0f766e;font-weight:800;font-size:11px}
#subjectBox{padding:5px;display:flex;flex-direction:column;gap:6px;max-height:380px;overflow-y:auto}
#subjectBox .vendor-card{background:linear-gradient(135deg,#174a7e 0%,#1e6fa5 100%)!important;border-radius:10px!important;padding:8px 12px!important;display:flex;justify-content:space-between;align-items:center;margin:4px;border:0!important}
#subjectBox .vendor-card span{color:#fff!important;font-weight:700!important;font-size:11px!important}
#subjectBox .vendor-card span i{color:#FDE68A!important}
.btn-toggle-switch{border:none;border-radius:20px;padding:4px 10px;font-size:9px;font-weight:800;color:#fff;min-width:44px}
.btn-toggle-switch.on{background:linear-gradient(135deg,#22c55e,#16a34a)}
.btn-toggle-switch.off{background:linear-gradient(135deg,#e5e7eb,#cbd5e1);color:#64748b!important}
</style>
</head>
<body>
<div class="container mt-2" style="max-width:600px">
  <div class="ledger-white-card">
    <div style="padding:8px 10px 10px;background:#fff">
      <div class="d-flex justify-content-between align-items-center">
        <button onclick="history.back()" class="action-btn">⬅️ Back</button>
        <div style="font-weight:800;font-size:9px;color:#174a7e">॥ श्री गणेशाय नमः ॥</div>
        <span id="dashStatus" class="badge" style="background:#ecfdf5;color:#0f766e;font-size:8px;border:1px solid #a7f3d0;padding:3px 6px">ACTIVE</span>
      </div>
      <div class="mt-2" style="line-height:1.2">
        <div id="pName" style="font-weight:900;font-size:15px;color:#174a7e">Name</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap">
          <span id="pPhone" style="color:#0f766e;font-size:10px;font-weight:700"></span>
          <small id="pBoard" style="font-size:9px;color:#475569"></small>
          <small style="font-size:8px;color:#94a3b8">•</small>
          <small id="pClass" style="font-size:10px;font-weight:800;color:#174a7e"></small>
        </div>
      </div>
      <div class="filter-grid mt-2">
        <button onclick="sendFeeReminder()" class="filter-btn">💰 फीस रिमाइंडर</button>
        <button onclick="sendLeaveNotice()" class="filter-btn">🏖️ अवकाश</button>
        <button onclick="openAddFee()" class="filter-btn">➕ Add Fees</button>
      </div>
      <div id="addFeeBox" style="display:none" class="mt-2">
        <div class="card p-2" style="background:#f8fafc;border:1px solid #dbeafe">
          <div class="row g-1">
            <div class="col-6"><input id="feeDate" type="date" class="form-control form-control-sm" style="font-size:10px;height:30px"></div>
            <div class="col-6"><select id="feeMonth" class="form-select form-select-sm" style="font-size:10px;height:30px"><option value="">माह चुनें</option><option>जनवरी</option><option>फरवरी</option><option>मार्च</option><option>अप्रैल</option><option>मई</option><option>जून</option><option>जुलाई</option><option>अगस्त</option><option>सितंबर</option><option>अक्टूबर</option><option>नवंबर</option><option>दिसंबर</option></select></div>
            <div class="col-6"><input id="feeAmount" type="number" class="form-control form-control-sm" placeholder="₹" style="font-size:10px;height:30px"></div>
            <div class="col-6"><select id="feeMode" class="form-select form-select-sm" style="font-size:10px;height:30px"><option>Cash</option><option>UPI</option><option>Bank</option></select></div>
            <div class="col-12"><button onclick="saveStudentFee()" class="btn w-100 text-white btn-sm" style="background:#174a7e;font-size:10px;height:30px">Save</button></div>
          </div>
        </div>
      </div>
    </div>
    <div class="ledger-top d-flex justify-content-between"><span>📒 Ledger</span><small>swipe करें</small></div>
    <div class="ledger-scroll">
      <div class="ledger-main">
        <div class="ledger-col left">
          <div class="col-title jama">💰 फीस - Date/Month</div>
          <div class="header-row"><div>राशि</div><div>तारीख</div><div>माह</div></div>
          <div id="feeList"></div>
        </div>
        <div class="ledger-col">
          <div class="col-title gaya">📚 Active Course On/Off</div>
          <div class="header-row"><div style="grid-column:1/-1">Subject - Toggle</div></div>
          <div id="subjectBox"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../../config.js"></script>
<script>
let stu = {};
try{ stu = JSON.parse(localStorage.getItem('viewingStudent')||'{}'); }catch(e){}
if(!stu ||!stu.name){ stu = {id:'demo1',name:'Demo Student',phone:'9876543210',board:'MP Board (Hindi Medium)',class:'Class 10th',access:true}; }
document.getElementById('pName').innerText=stu.name||'';
document.getElementById('pPhone').innerText='📞 '+(stu.phone||stu.mobile||'');
document.getElementById('pBoard').innerText=stu.board||'';
document.getElementById('pClass').innerText=stu.class||'';
function openAddFee(){ let b=document.getElementById('addFeeBox'); b.style.display=b.style.display=='none'?'block':'none'; }
function sendFeeReminder(){
  let ph=(stu.pPhone||stu.parentPhone||stu.phone||stu.mobile||'').toString().replace(/\D/g,'');
  if(ph.length==10) ph='91'+ph;
  let allFees=JSON.parse(localStorage.getItem('pal_fees_'+stu.id)||'[]');
  let lastFee = allFees[0] || {};
  let month = lastFee.month || document.getElementById('feeMonth').value || 'इस माह';
  let amt = lastFee.amount || '500';
  let msg = `नमस्ते अभिभावक जी 🙏\n\nआपसे निवेदन है कि ${stu.name} की ${month} माह की फीस ₹${amt} जमा करना शेष है।\nकृपया शीघ्र जमा कराने की कृपा करें।\n\nधन्यवाद 🙏\n- पाल स्टडी सेंटर, मनासा`;
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`,'_blank');
}
function sendLeaveNotice(){
  let ph=(stu.phone||stu.mobile||'').toString().replace(/\D/g,'');
  if(ph.length==10) ph='91'+ph;
  let today = new Date().toLocaleDateString('hi-IN');
  let msg = `नमस्ते ${stu.name}\n\nआवश्यक कार्य होने से आज ${today} को पाल स्टडी सेंटर पर अवकाश रहेगा।\n\n- पाल स्टडी सेंटर`;
  window.open(`https://wa.me/${ph}?text=${encodeURIComponent(msg)}`,'_blank');
}
function getSubjects(cls){
  if(cls && (cls.includes('11') || cls.includes('12'))){ return ["Physics","Chemistry","Mathematics","Biology","English","Hindi"]; }
  return ["Science","Social Science","Mathematics","English","Hindi"];
}
async function loadCourseData(){
  if(!stu.courses) stu.courses={};
  if(stu.id){
    try{
      const response = await fetch(`${CONFIG.BASE_URL}/students/${stu.id}/subjects`);
      const data = await response.json();
      if(response.ok && data.status && data.res && typeof data.res === 'object' &&!Array.isArray(data.res)){
        if(Object.keys(data.res).length===0){ stu.access=false; stu.courses={}; }
        else{ Object.entries(data.res).forEach(([subject,value])=>{ stu.courses[subject]=value===1; }); }
      }
    }catch(err){}
  }
  if(Object.keys(stu.courses).length===0){ const subjects=getSubjects(stu.class); subjects.forEach(s=>stu.courses[s]=true); }
  renderCourses();
}
function renderCourses(){
  const box=document.getElementById("subjectBox"); box.innerHTML="";
  if(stu.access===false){ box.innerHTML='<div style="padding:12px;text-align:center;color:#888;font-size:10px">Access OFF है</div>'; return; }
  const subjects=getSubjects(stu.class);
  subjects.forEach(subject=>{
    const isEnabled=stu.courses[subject]!==false;
    box.innerHTML+=`<div class="vendor-card"><span><i class="bi bi-book"></i> ${subject}</span><button class="btn-toggle-switch ${isEnabled?'on':'off'}" onclick="toggleCourseAccess('${subject}')">${isEnabled?'ON':'OFF'}</button></div>`;
  });
}
async function toggleCourseAccess(subject){
  if(!stu.courses) stu.courses={}; const cur=stu.courses[subject]!==false; stu.courses[subject]=!cur; renderCourses(); localStorage.setItem("viewingStudent",JSON.stringify(stu));
  const subjectsHash={}; Object.entries(stu.courses).forEach(([s,enabled])=>{ subjectsHash[s]=enabled?1:0; }); await updateCourseStatusOnServer(subjectsHash);
}
async function updateCourseStatusOnServer(subjectsHash){
  if(!stu.id) return;
  try{ await fetch(`${CONFIG.BASE_URL}/students/${stu.id}/subjects`,{ method:'PATCH',headers:{'Content-Type':'application/json'}, body:JSON.stringify({subjects:subjectsHash}) }); }catch(err){}
}
async function saveStudentFee(){
  let amt=document.getElementById('feeAmount').value; if(!amt) return alert('Amount डालें');
  let sid = stu.id || stu._id || stu.phone || stu.mobile;
  let payload={ student_id: sid, phone: stu.phone || stu.mobile || '', date: document.getElementById('feeDate').value || new Date().toISOString().split('T')[0], month: document.getElementById('feeMonth').value || '', amount: amt, mode: document.getElementById('feeMode').value, board: stu.board, class: stu.class };
  let allFees=JSON.parse(localStorage.getItem('pal_fees_'+sid)||'[]'); allFees.unshift(payload); localStorage.setItem('pal_fees_'+sid,JSON.stringify(allFees)); localStorage.setItem('pal_fees_'+(stu.id||sid),JSON.stringify(allFees)); localStorage.setItem('viewingStudent',JSON.stringify(stu));
  try{ let url = getApiUrl(CONFIG.API.FEES); await fetch(url,{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) }); }catch(e){}
  loadFees(); document.getElementById('addFeeBox').style.display='none'; document.getElementById('feeAmount').value='';
}
async function loadFees(){
  let sid = stu.id || stu._id || stu.phone || stu.mobile; let allFees=JSON.parse(localStorage.getItem('pal_fees_'+sid)||'[]');
  try{ let url = getApiUrl(CONFIG.API.FEES+'?student_id='+sid); let r=await fetch(url); let j=await r.json(); if(j.res && Array.isArray(j.res) && j.res.length) allFees=j.res; else if(j.data && Array.isArray(j.data) && j.data.length) allFees=j.data; else if(Array.isArray(j) && j.length) allFees=j; if(allFees.length) localStorage.setItem('pal_fees_'+sid, JSON.stringify(allFees)); }catch(e){}
  let html=allFees.length? allFees.map(f=>`<div class="entry-grid"><div>₹${f.amount}</div><div>${f.date||''}</div><div>${f.month||''}</div></div>`).join('') : '<div style="padding:8px;text-align:center;color:#888;font-size:10px">No Fees - Add से जोड़ें</div>';
  document.getElementById('feeList').innerHTML=html;
}
loadFees(); loadCourseData();
</script>
</body>
</html>
