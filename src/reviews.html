<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pal Study Center</title>
<link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:Arial,sans-serif;background:#f4f7fb;overflow-x:hidden;}

.hero{
height:40vh;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
}
.circle{position:absolute;border-radius:50%;background:rgba(255,255,255,0.08);animation:float 8s infinite linear;}
.circle1{width:260px;height:260px;top:-70px;left:-70px;}
.circle2{width:180px;height:180px;bottom:40px;right:-40px;animation-duration:10s;}
.circle3{width:120px;height:120px;top:55%;left:10%;animation-duration:6s;}

.hero-content{text-align:center;color:#fff;z-index:2;padding:20px;animation:fadeUp 1.5s ease;}
.hero-content h1{font-size:58px;font-weight:bold;margin-bottom:12px;}
.hero-content h2{font-size:28px;color:#facc15;margin-bottom:18px;}
.hero-content p{font-size:21px;color:#e5e7eb;}
.hero-btn{display:inline-block;padding:14px 38px;background:#fff;color:#1e3a8a;border-radius:50px;text-decoration:none;transition:0.3s;}
.hero-btn:hover{background:#facc15;color:#000;transform:scale(1.05);}

.review-section{padding:90px 20px;}
.section-title{text-align:center;font-size:40px;color:#1f4db8;font-weight:bold;}
.section-subtitle{text-align:center;margin-bottom:40px;color:#555;}

/* ===== UPDATED REVIEW CARD CSS ===== */
.review-card{
  background:#fff;
  padding:22px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  height:100%;
  transition:0.4s;
  border:1px solid #eef2ff;
  display:flex;
  flex-direction:column;
  text-align:left;
}
.review-card:hover{
  transform:translateY(-8px);
  box-shadow:0 18px 35px rgba(0,0,0,0.15);
}
.review-card img{
  width:70px;height:70px;border-radius:50%;object-fit:cover;
  border:3px solid #2563eb;
  display:none; /* अगर image नहीं चाहिए तो hide, चाहिए तो इस line को हटा देना */
}

/* नया Top Layout */
.review-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:16px;
}
.review-badges{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
}
.review-badges span, .student-info{
  font-size:11px;
  font-weight:700;
  padding:5px 12px;
  border-radius:50px;
  line-height:1;
  display:inline-block;
  margin:0 !important;
}
.review-badges span:nth-child(1), .badge-percent{
  background:#fef3c7;color:#92400e;border:1px solid #fcd34d;
}
.review-badges span:nth-child(2), .badge-class{
  background:#dbeafe;color:#1e40af;border:1px solid #93c5fd;
}
.review-badges span:nth-child(3), .badge-medium{
  background:#dcfce7;color:#166534;border:1px solid #86efac;
}
.review-card h2{
  font-size:19px !important;
  font-weight:800 !important;
  color:#0f172a !important;
  text-align:right;
  margin:0;
  line-height:1.3;
  flex:1;
}
.review-text{
  font-size:14.5px !important;
  color:#475569 !important;
  line-height:1.7 !important;
  margin-bottom:16px !important;
  flex-grow:1;
}
.stars{
  color:#f59e0b !important;
  font-size:20px !important;
  margin-top:auto !important;
  background:#fffbeb;
  display:inline-block !important;
  padding:4px 14px;
  border-radius:50px;
  border:1px solid #fde68a;
  align-self:flex-start;
  letter-spacing:2px;
}

@keyframes float{
0%{transform:translateY(0);}50%{transform:translateY(20px);}100%{transform:translateY(0);}
}
@keyframes fadeUp{
from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}
}
.back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#ffffff;
  color:#1f4db8;
  padding:12px 24px;
  border-radius:14px;
  text-decoration:none;
  font-weight:700;
  margin-bottom:35px;
  box-shadow:0 5px 18px rgba(0,0,0,0.08);
  transition:0.3s;
}
.back-btn:hover{
  transform:translateY(-3px);
  color:#1f4db8;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
<div class="container">
<a class="navbar-brand fw-bold" href="#">पाल स्टडी सेंटर </a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
<span class="navbar-toggler-icon"></span>
</button>
<div class="collapse navbar-collapse" id="navMenu">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link" href="#reviews">Reviews</a></li>
<li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
<li class="nav-item"><a class="nav-link" href="#" onclick="openAddReviewModal(event)">Add Review</a></li>
</ul>
</div>
</div>
</nav>

<section class="hero">
<div class="circle circle1"></div>
<div class="circle circle2"></div>
<div class="circle circle3"></div>

<div class="hero-content">
  <a href="../index.html" class="back-btn">
  <i class="bi bi-arrow-left"></i>
  Back To Home
  </a>
<br>
  <a href="#reviews" class="hero-btn">Students Reviews</a>
<br><br>
  <p>“Trusted by Our Brilliant Students”</p>
<div class="mb-4 text-end">
  <button class="btn btn-warning" onclick="openAddReviewModal(event)">Add Review</button>
</div>
</div>
</section>

<section class="review-section" id="reviews">
<div class="container">
<div class="row g-4" id="reviewGrid">
</div>
</section>
  
  
<!-- Add Review Modal -->
<div class="modal fade" id="addReviewModal" tabindex="-1" aria-labelledby="addReviewModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addReviewModalLabel">Add Review</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="reviewForm">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Student Name</label>
              <input type="text" id="reviewStudentName" class="form-control" placeholder="Enter student name" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Class</label>
              <select id="reviewClass" class="form-select" required>
                <option value="">Select class</option>
                <option value="Class 9th">Class 9th</option>
                <option value="Class 10th">Class 10th</option>
                <option value="Class 11th">Class 11th</option>
                <option value="Class 12th">Class 12th</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Board</label>
              <select id="reviewBoard" class="form-select" required>
                <option value="">Select board</option>
                <option value="MP Board (Hindi Medium)">MP Board (Hindi Medium)</option>
                <option value="MP Board (English Medium)">MP Board (English Medium)</option>
                <option value="CBSE">CBSE</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Stars Rating</label>
              <select id="reviewRating" class="form-select" required>
                <option value="">Select rating</option>
                <option value="5">★★★★★</option>
                <option value="4">★★★★</option>
                <option value="3">★★★</option>
                <option value="2">★★</option>
                <option value="1">★</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Write Review</label>
              <textarea id="reviewText" class="form-control" rows="4" placeholder="Write the review text" required></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Review</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">
<p class="mb-0">© 2026 Pal Study Center | All Rights Reserved</p>
</footer>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="reviews.js"></script>
</body>
</html
